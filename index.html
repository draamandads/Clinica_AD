            <option value="">—</option>
            <option value="PCST">PCST</option>
            <option value="PCST pélvico">PCST pélvico</option>
            <option value="PN">PN</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Auxílio (nome do auxiliar)</label><input id="pt-aux" placeholder="Se houver"></div>
        <div class="field" style="align-self:end;">
          <label>&nbsp;</label>
          <button class="btn btn-brick" style="width:100%;" id="btn-marcar-parto">🏥 Marcar como Realizado</button>
        </div>
      </div>
      <div class="field"><label>Observações</label><textarea id="pt-obs" rows="2">${p.parto.observacao||''}</textarea></div>
    `;
  }

  // Eventos parto
  const saveParto=async()=>{
    p.parto.hospital=(cardParto.querySelector('#pt-hosp')||{}).value||'';
    p.parto.medicoTitular=(cardParto.querySelector('#pt-titular')||{}).value||'';
    p.parto.equipObstetrica=(cardParto.querySelector('#pt-eo')||{}).value||'';
    p.parto.viaParto=(cardParto.querySelector('#pt-via')||{}).value||'';
    p.parto.auxilioNome=(cardParto.querySelector('#pt-aux')||{}).value||'';
    p.parto.auxilio=!!p.parto.auxilioNome;
    p.parto.observacao=(cardParto.querySelector('#pt-obs')||{}).value||'';
    if(!p.parto.parceiroAssinou){
      p.parto.funcoesParceiro={
        inducao:!!(cardParto.querySelector('#fp-inducao')||{}).checked,
        conducao:!!(cardParto.querySelector('#fp-conducao')||{}).checked,
        auxiliar:!!(cardParto.querySelector('#fp-auxiliar')||{}).checked,
        titular:!!(cardParto.querySelector('#fp-titular')||{}).checked,
        outros:(cardParto.querySelector('#fp-outros')||{}).value||''
      };
    }
  };
  if(p.parto.realizado){
    cardParto.querySelector('#btn-save-parto').onclick=async()=>{await saveParto();await commitObstEdit(p);showToast('Dados do parto salvos.');};
  } else {
    cardParto.querySelector('#btn-marcar-parto').onclick=async()=>{
      const dataEl=cardParto.querySelector('#pt-data');
      if(!dataEl.value){showToast('Informe a data do parto.');return;}
      await saveParto();
      p.parto.realizado=true;
      p.parto.data=dataEl.value;
      await commitObstEdit(p);showToast('Parto registrado!');render();
    };
  }

  // Pós-parto
  if(p.parto.realizado){
    wrap.querySelectorAll('[data-pp]').forEach(cb=>cb.onchange=async()=>{
      const k=cb.dataset.pp;
      p.posParto[k].feita=cb.checked;
      p.posParto[k].data=cb.checked?isoDate(t):'';
      await commitObstEdit(p);render();
    });
    wrap.querySelectorAll('[data-pp-date]').forEach(inp=>inp.onchange=async()=>{
      p.posParto[inp.dataset.ppDate].data=inp.value;await commitObstEdit(p);
    });
  }

  // Consultas pré-natal


  // Salvar dados do parceiro
  const btnSaveParceiro=wrap.querySelector('#btn-save-parceiro');
  if(btnSaveParceiro) btnSaveParceiro.onclick=async()=>{
    if(!p.parto.parceiroAssinou){
      p.parto.nomeMedicoParceiro=(wrap.querySelector('#parc-nome')||{value:''}).value||'';
      p.parto.funcoesParceiro={
        apresentacao:!!(wrap.querySelector('#fp-apresentacao')||{}).checked,
        inducao:!!(wrap.querySelector('#fp-inducao')||{}).checked,
        conducao:!!(wrap.querySelector('#fp-conducao')||{}).checked,
        auxiliar:!!(wrap.querySelector('#fp-auxiliar')||{}).checked,
        titular:!!(wrap.querySelector('#fp-titular')||{}).checked,
        visita1:!!(wrap.querySelector('#fp-visita1')||{}).checked,
        visita2:!!(wrap.querySelector('#fp-visita2')||{}).checked,
        outros:(wrap.querySelector('#fp-outros')||{value:''}).value||''
      };
      await commitObstEdit(p);
      showToast('Dados do médico parceiro salvos.');
    }
  };

  // Desistência
  const btnDesistir=wrap.querySelector('#btn-desistir');
  if(btnDesistir) btnDesistir.onclick=async()=>{
    if(!confirm('Marcar '+p.nome+' como desistência? O cadastro será mantido com status de desistência.')) return;
    p.desistiu=true;
    p.dataDesistencia=isoDate(today());
    p.motivoDesistencia=(wrap.querySelector('#motivo-desistencia')||{value:''}).value.trim();
    await commitObstEdit(p); showToast('Desistência registrada.'); render();
  };
  const btnReativar=wrap.querySelector('#btn-reativar');
  if(btnReativar) btnReativar.onclick=async()=>{
    if(!confirm('Reativar o cadastro de '+p.nome+'?')) return;
    p.desistiu=false; p.dataDesistencia=''; p.motivoDesistencia='';
    await commitObstEdit(p); showToast('Cadastro reativado.'); render();
  };

  // Migration to gyneco
  const btnMigrar=wrap.querySelector('#btn-migrar');
  if(btnMigrar) btnMigrar.onclick=async()=>{
    if(!confirm('Migrar '+p.nome+' para a aba Ginecológicas? As datas de consulta serão preenchidas lá.')) return;
    // Create gyneco patient with no auto dates
    const gp={id:crypto.randomUUID(),nome:p.nome,telefone:p.telefone||'',
      cadastradoEm:'',ultimaConsulta:'',
      papColetado:false,dataColeta:null,papChecado:false,dataChecagem:null,
      papResultado:'',pacienteNotificada:false,
      retornoMarcado:false,dataRetorno:null,
      seguimento:'1ano',observacoes:'',consultas:[],migradaDeObstetrica:true};
    state.gyneco=await addPatient(KEY_GIN,gp);
    p.migradaParaGineco=true;
    await commitObstEdit(p);
    showToast(p.nome+' migrada para Ginecológicas.');render();
  };

  wrap.querySelector('#btn-del').onclick=async()=>{
    if(confirm('Excluir este cadastro definitivamente?')){
      const delId=p.id;
      state.obstetric=state.obstetric.filter(x=>x.id!==delId);
      await saveLocal(KEY_OBST,state.obstetric);
      await syncToSheets('delete',{id:delId});
      state.modal=null;render();
    }
  };

  return wrap;
}

        <div class="dt"><input type="date" id="d-check" value="${gp.dataChecagem||''}" ${!gp.papChecado?'disabled':''}></div>

          <button class="btn btn-sm ${!gp.papResultado?'btn-primary':'btn-secondary'}" id="res-limpar">— Não informado</button>

      <div class="checkrow">
        <input type="checkbox" id="c-notif" ${gp.pacienteNotificada?'checked':''}>
        <div class="ct"><div class="t">Paciente notificada</div><div class="d">Devolutiva positiva enviada à paciente</div></div>
      </div>`:''}

      <div class="checkrow" style="padding-top:8px;">

        ${[['diu-interesse','interesse','Interesse por DIU'],['diu-disponivel','disponivel','DIU disponível'],['diu-agenda','agendamento','Agendamento realizado'],['diu-insercao','insercao','Inserção realizada'],['diu-pagto','pagamento','Pagamento realizado'],['diu-nf','nf','Nota fiscal enviada']].map(([id,key,label])=>`

    op.nome=p.nome; op.telefone=p.telefone||'';
    op.migradaDeGineco=true;
    state.obstetric=await addPatient(KEY_OBST,op);

    p.migradaParaObstetrica=true;
    await commitGinEdit(p);
    showToast(p.nome+' migrada para Gestantes. Complete as informações lá.');
    render();
  };

      if(idx>=0) state.gyneco[idx].diu={...state.gyneco[idx].diu,[key]:e.target.checked};

    await commitGinEdit(state.gyneco[idx]);render();
  };
  wrap.querySelector('#d-pap').onchange=async(e)=>{gp.dataColeta=e.target.value;const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)state.gyneco[idx].dataColeta=e.target.value;await commitGinEdit(state.gyneco[idx]);};
  const cCheck=wrap.querySelector('#c-check');

        <button class="btn btn-secondary btn-sm" id="pick-cancel" style="margin-left:auto;">Cancelar</button>
      </div>`);

      picker.querySelector('#pick-cancel').onclick=()=>{
        e.target.checked=false; e.target.disabled=false; picker.remove();
      };
      const pickResult=async(res)=>{
        gp.papChecado=true; gp.dataChecagem=isoDate(t); gp.papResultado=res;
        const idx=state.gyneco.findIndex(x=>x.id===id);
        if(idx>=0) Object.assign(state.gyneco[idx],gp);
        await commitGinEdit(state.gyneco[idx]); render();
      };
      picker.querySelector('#pick-normal').onclick=()=>pickResult('normal');
      picker.querySelector('#pick-alterado').onclick=()=>pickResult('alterado');
    } else {
      gp.papChecado=false;gp.dataChecagem=null;gp.papResultado='';gp.pacienteNotificada=false;
      const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)Object.assign(state.gyneco[idx],gp);
      await commitGinEdit(state.gyneco[idx]);render();
    }
  };
  const dCheck=wrap.querySelector('#d-check');
  if(dCheck) dCheck.onchange=async(e)=>{gp.dataChecagem=e.target.value;const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)state.gyneco[idx].dataChecagem=e.target.value;await commitGinEdit(state.gyneco[idx]);};
  const updateRes=async(res)=>{gp.papResultado=res;const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)state.gyneco[idx].papResultado=res;await commitGinEdit(state.gyneco[idx]);render();};
  const btnN=wrap.querySelector('#res-normal');const btnA=wrap.querySelector('#res-alterado');const btnL=wrap.querySelector('#res-limpar');
  if(btnN) btnN.onclick=()=>updateRes('normal');
  if(btnA) btnA.onclick=()=>updateRes('alterado');
  if(btnL) btnL.onclick=()=>updateRes('');
  const cNotif=wrap.querySelector('#c-notif');
  if(cNotif) cNotif.onchange=async(e)=>{gp.pacienteNotificada=e.target.checked;const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)state.gyneco[idx].pacienteNotificada=e.target.checked;await commitGinEdit(state.gyneco[idx]);render();};
  const cPapMedico=wrap.querySelector('#c-pap-medico');
  if(cPapMedico){
    cPapMedico.onchange=async(e)=>{
      const field=wrap.querySelector('#pap-medico-field');
      if(field) field.style.display=e.target.checked?'block':'none';
      gp.papMedicoResponsavel=e.target.checked;
      const idx=state.gyneco.findIndex(x=>x.id===id);
      if(idx>=0){state.gyneco[idx].papMedicoResponsavel=e.target.checked;await commitGinEdit(state.gyneco[idx]);}
    };
    const nomeInput=wrap.querySelector('#pap-medico-nome');
    if(nomeInput) nomeInput.onblur=async()=>{
      gp.papNomeMedico=nomeInput.value;
      const idx=state.gyneco.findIndex(x=>x.id===id);
      if(idx>=0){state.gyneco[idx].papNomeMedico=nomeInput.value;await commitGinEdit(state.gyneco[idx]);}
    };
  }
  wrap.querySelector('#c-retorno').onchange=async(e)=>{
    gp.retornoMarcado=e.target.checked;gp.dataRetorno=e.target.checked?isoDate(t):null;
    const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)Object.assign(state.gyneco[idx],{retornoMarcado:gp.retornoMarcado,dataRetorno:gp.dataRetorno});
    await commitGinEdit(state.gyneco[idx]);render();
  };
  wrap.querySelector('#d-retorno').onchange=async(e)=>{gp.dataRetorno=e.target.value;const idx=state.gyneco.findIndex(x=>x.id===id);if(idx>=0)state.gyneco[idx].dataRetorno=e.target.value;await commitGinEdit(state.gyneco[idx]);};
  wrap.querySelector('#btn-del').onclick=async()=>{
    if(confirm('Excluir?')){const gid=gp.id;state.gyneco=state.gyneco.filter(x=>x.id!==gid);await saveLocal(KEY_GIN,state.gyneco);await syncToSheets('deleteGin',{id:gid});state.modal=null;render();}
  };
  return wrap;
}

    {key:'duasSemanas', label:'Retorno 2 semanas', dias:0, prazo:21, alvo:14, cor:'var(--warn)', corBg:'var(--warn-light)'},
    {key:'quarentaDias', label:'Retorno 40 dias', dias:10, prazo:55, alvo:40, cor:'var(--warn)', corBg:'var(--warn-light)'},
    {key:'seisMeses', label:'Retorno 6 meses', dias:150, prazo:210, alvo:180, cor:'var(--teal)', corBg:'var(--teal-light)'},
  ];

  const sections = groups.map(g=>{
    const pacientes = state.obstetric
      .filter(p=>p.parto.realizado&&p.parto.data&&!p.posParto[g.key].feita)
      .filter(p=>{ const d=diffDays(t,parseDate(p.parto.data)); return d>=g.dias; })
      .sort((a,b)=>parseDate(a.parto.data)-parseDate(b.parto.data));

    if(!pacientes.length) return `
      <div style="margin-bottom:20px;">
        <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--teal-dark);margin-bottom:8px;">${g.label}</div>
        <div style="padding:12px;background:var(--ok-light);border-radius:8px;font-size:13px;color:var(--ok);font-weight:600;">✓ Todas as pacientes em dia</div>
      </div>`;

    const rows = pacientes.map(p=>{
      const dp=parseDate(p.parto.data);
      const dias=diffDays(t,dp);
      const atrasado=dias>g.prazo;
      return `<tr>
        <td style="cursor:pointer;" data-open="${p.id}"><strong>${p.nome}</strong></td>
        <td class="mono">${fmtDate(p.parto.data)}</td>
        <td style="font-weight:600;color:${atrasado?'var(--alert)':'var(--ink-muted)'};">${dias} dias${atrasado?' ⚠️':''}</td>
        <td>
          <button class="btn btn-secondary btn-sm" data-agendar="${p.id}" data-key="${g.key}">Agendado</button>
        </td>
      </tr>`;
    }).join('');

    return `
      <div style="margin-bottom:24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--teal-dark);">${g.label}</div>
          <span class="tag tag-warn">${pacientes.length} pendente${pacientes.length>1?'s':''}</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Paciente</th><th>Data do parto</th><th>Dias pós-parto</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join('');

  const totalPend = groups.reduce((acc,g)=>acc+state.obstetric.filter(p=>
    p.parto.realizado&&p.parto.data&&!p.posParto[g.key].feita&&diffDays(t,parseDate(p.parto.data))>=g.dias
  ).length, 0);

  wrap.innerHTML=`
    <div class="modal-head">
      <div>
        <h2>F-Up Pós-Parto</h2>
        <p class="muted-x">${totalPend>0?totalPend+' retorno(s) pendente(s)':'Todas as pacientes em dia'}</p>
      </div>
      <button class="close-x">✕</button>
    </div>
    ${state.fupUndoStack&&state.fupUndoStack.length>0?`
    <div style="background:var(--teal-light);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <span style="font-size:13px;color:var(--teal-dark);">✓ ${state.fupUndoStack[state.fupUndoStack.length-1].nome.split(' ')[0]} marcada como agendada</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" id="btn-undo-fup">Desfazer</button>
        <button class="btn btn-secondary btn-sm" id="btn-clear-undo">✕</button>
      </div>
    </div>`:''}
    <div style="margin-top:4px;">${sections}</div>
  `;

  wrap.querySelector('.close-x').onclick=()=>{state.modal=null;state.fupUndoStack=[];render();};

  // Undo last action
  const btnUndoFup=wrap.querySelector('#btn-undo-fup');
  if(btnUndoFup) btnUndoFup.onclick=async()=>{
    const last=(state.fupUndoStack||[]).pop();
    if(!last) return;
    const pu=state.obstetric.find(x=>x.id===last.patientId); if(!pu) return;
    pu.posParto[last.key]={feita:false,data:''};
    await commitObstEdit(pu);
    showToast('Retorno desmarcado para '+last.nome.split(' ')[0]+'.');render();
  };
  const btnClearUndo=wrap.querySelector('#btn-clear-undo');
  if(btnClearUndo) btnClearUndo.onclick=()=>{state.fupUndoStack=[];render();};
  wrap.querySelectorAll('[data-open]').forEach(td=>td.onclick=()=>openObstetricModal(td.dataset.open));

  // Agendado: marca como feito, mostra desfazer no topo via re-render
  wrap.querySelectorAll('[data-agendar]').forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const p=state.obstetric.find(x=>x.id===btn.dataset.agendar); if(!p) return;
      const key=btn.dataset.key;
      p.posParto[key]={feita:true,data:isoDate(t)};
      await commitObstEdit(p);
      // Store last action for undo
      if(!state.fupUndoStack) state.fupUndoStack=[];
      state.fupUndoStack.push({patientId:p.id,key,nome:p.nome});
      render();
    };
  });

  return wrap;
}

function modalAssinarParceiro(patientId){
  const wrap=el(`<div></div>`);
  const p=state.obstetric.find(x=>x.id===patientId);
  if(!p){wrap.innerHTML='<p>Paciente não encontrada.</p>';return wrap;}
  const fp=p.parto.funcoesParceiro||{};
  const funcLabel=(f)=>{const l=[];if(f.inducao)l.push('Indução');if(f.conducao)l.push('Condução');if(f.auxiliar)l.push('Auxiliar');if(f.titular)l.push('Médico Titular');if(f.outros)l.push(f.outros);return l.join(', ')||'—';};

  wrap.innerHTML=`
    <div class="modal-head">
      <div><h2>Assinar participação no parto</h2>
        <p class="muted-x">${state.settings.nomeParceiro||'Médico Parceiro'}</p>
      </div>
      <button class="close-x">✕</button>
    </div>
    <div class="card" style="margin-bottom:16px;background:var(--surface-2);">
      <div style="font-size:13px;line-height:1.8;">
        <div><strong>Paciente:</strong> ${p.nome}</div>
        <div><strong>Data do parto:</strong> ${fmtDate(p.parto.data)}</div>
        <div><strong>Hospital:</strong> ${p.parto.hospital||'—'}</div>
        <div><strong>Via:</strong> ${p.parto.viaParto||'—'}</div>
        <div><strong>Funções:</strong> ${funcLabel(fp)}</div>
      </div>
    </div>
    <div class="field" style="margin-bottom:16px;">
      <label>Digite o PIN para confirmar a assinatura</label>
      <input type="password" id="pin-input" placeholder="PIN do médico parceiro" maxlength="6"
        style="font-size:20px;text-align:center;letter-spacing:8px;padding:12px;">
      <p id="pin-erro" style="color:var(--alert);font-size:12px;margin-top:6px;display:none;">PIN incorreto. Tente novamente.</p>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="btn-confirmar-pin">Confirmar assinatura</button>
      <button class="btn btn-secondary" id="btn-cancelar-pin">Cancelar</button>
    </div>
  `;

  wrap.querySelector('.close-x').onclick=
  wrap.querySelector('#btn-cancelar-pin').onclick=()=>{state.modal=null;render();};

  const pinInput=wrap.querySelector('#pin-input');
  const btnConfirmar=wrap.querySelector('#btn-confirmar-pin');
  const pinErro=wrap.querySelector('#pin-erro');

  pinInput.onkeydown=(e)=>{ if(e.key==='Enter') btnConfirmar.click(); };
  setTimeout(()=>pinInput.focus(),100);

  btnConfirmar.onclick=async()=>{
    const pin=pinInput.value.trim();
    if(pin!==String(state.settings.pinParceiro)){
      pinErro.style.display='block';
      pinInput.value=''; pinInput.focus();
      return;
    }
    p.parto.parceiroAssinou=true;
    p.parto.dataAssinaturaParceiro=isoDate(today());
    p.parto.assinadoPor=state.settings.nomeParceiro||'Médico Parceiro';
    await commitObstEdit(p);
    showToast('✓ Assinatura confirmada com PIN.');
    state.modal=null;render();
  };

  return wrap;
}

function exportarPdfParceiro(listaPartos, listaPap, mesesFiltro, nomeFiltro, resumo, filtros){
  const t=today();
  filtros=filtros||{};

  // Build period label
  const partes=[];
  if(filtros.medico) partes.push('Médico: '+filtros.medico);
  if(filtros.anos&&filtros.anos.size>0) partes.push([...filtros.anos].sort().join(', '));
  if(mesesFiltro&&mesesFiltro.size>0) partes.push([...mesesFiltro].sort().map(m=>{const[y,mo]=m.split('-');return new Date(Number(y),Number(mo)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});}).join(', '));
  if(filtros.semana) partes.push(filtros.semana.replace('sem','Semana '));
  const periodoLabel=partes.length>0?partes.join(' · '):'Todos os registros';

  const funcoesConfig=[
    ['apresentacao','Consulta de apresentação'],['inducao','Indução'],['conducao','Condução'],
    ['auxiliar','Auxiliar'],['titular','Médico Titular'],['visita1','1ª visita pós-parto'],['visita2','2ª visita pós-parto'],
  ];

  const rowsPartos=listaPartos.map((p,i)=>{
    const f=p.parto.funcoesParceiro||{};
    const outros=f.outros?`<div style="font-size:11px;margin-top:4px;color:#5C3D2E;">Outros: ${f.outros}</div>`:'';
    const funcsHtml=funcoesConfig.map(([k,label])=>`
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
        <span style="display:inline-block;width:12px;height:12px;border:1.5px solid #2A8880;border-radius:2px;background:${f[k]?'#2A8880':'#fff'};text-align:center;line-height:12px;font-size:9px;color:#fff;">${f[k]?'✓':''}</span>
        <span style="font-size:11px;${f[k]?'font-weight:600;color:#2A8880;':''}">${label}</span>
      </div>`).join('');
    return `<tr style="${i%2===0?'background:#f8f5f2;':''}">
      <td>${p.nome}</td>
      <td>${p.parto.realizado&&p.parto.data?new Date(p.parto.data+'T00:00:00').toLocaleDateString('pt-BR'):'DPP: '+(calcDPP(p.dum,p.dppManual)?calcDPP(p.dum,p.dppManual).toLocaleDateString('pt-BR'):'—')}</td>
      <td>${p.parto.nomeMedicoParceiro||'—'}</td>
      <td>${p.parto.viaParto||'—'}</td>
      <td>${funcsHtml}${outros}</td>
    </tr>`;
  }).join('');

  const rowsPap=listaPap.map((g,i)=>`
    <tr style="${i%2===0?'background:#f8f5f2;':''}">
      <td>${g.nome}</td>
      <td>${g.papNomeMedico||'—'}</td>
      <td>${g.dataChecagem?new Date(g.dataChecagem+'T00:00:00').toLocaleDateString('pt-BR'):'—'}</td>
      <td style="font-weight:600;color:${g.papResultado==='normal'?'#1e8c6e':g.papResultado==='alterado'?'#c0392b':'#888'};">${g.papResultado==='normal'?'Normal':g.papResultado==='alterado'?'Alterado':'—'}</td>
    </tr>`).join('');

  const html=`<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório Médico Parceiro — Clínica AD</title>
  <style>
    body{font-family:Arial,sans-serif;color:#2C1810;margin:0;padding:32px;font-size:12px;}
    h1{font-size:20px;margin:0 0 4px;}h2{font-size:15px;margin:20px 0 8px;color:#2A8880;border-bottom:1px solid #2A8880;padding-bottom:4px;}
    table{width:100%;border-collapse:collapse;margin-bottom:24px;}
    th{background:#2A8880;color:#fff;padding:8px 10px;text-align:left;font-size:11px;}
    td{padding:7px 10px;border-bottom:1px solid #e0d8d0;vertical-align:top;}
    .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;border-bottom:2px solid #2A8880;padding-bottom:14px;}
    .periodo{background:#e0f3f1;padding:8px 14px;border-radius:6px;font-size:12px;color:#2A8880;font-weight:600;margin-bottom:18px;}
    .assinatura{margin-top:40px;display:flex;gap:80px;}
    .assinatura-box{flex:1;border-top:1px solid #2C1810;padding-top:8px;font-size:11px;color:#5C3D2E;}
    @media print{body{padding:20px;}button{display:none;}}
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 style="color:#2A8880;">Clínica AD — Relatório Médico Parceiro</h1>
      <div style="font-size:11px;color:#8a8c94;">Gerado em ${t.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}</div>
    </div>
    <button onclick="window.print()" style="background:#2A8880;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:13px;">🖨️ Imprimir / Salvar PDF</button>
  </div>

  <div class="periodo">📅 Período: ${periodoLabel}</div>

  ${listaPartos.length>0?`
  <h2>Gestantes</h2>
  <table>
    <thead><tr><th>Paciente</th><th>Data do Parto</th><th>Médico Parceiro</th><th>Via</th><th>Funções realizadas</th></tr></thead>
    <tbody>${rowsPartos||'<tr><td colspan="5" style="text-align:center;color:#8a8c94;">Nenhum registro.</td></tr>'}</tbody>
  </table>`:''}

  ${listaPap.length>0?`
  <h2>Ginecológicas — Conferência Papanicolau</h2>
  <table>
    <thead><tr><th>Paciente</th><th>Médico</th><th>Data conferência</th><th>Resultado</th></tr></thead>
    <tbody>${rowsPap}</tbody>
  </table>`:''}

  ${listaPartos.length===0&&listaPap.length===0?`<p style="color:#8a8c94;text-align:center;padding:40px;">Nenhum registro encontrado para o período selecionado.</p>`:''}

  <div class="assinatura">
    <div class="assinatura-box">Dra. Amanda Dantas<br>Médica Responsável — CRM</div>
    <div class="assinatura-box">${state.settings.nomeParceiro||'Médico Parceiro'}<br>CRM</div>

  const win=window.open('','_blank','width=1000,height=700');
  win.document.write(html);

/* ═══════════════════════════════════════════════
   MODAL: FILTRO PDF MÉDICO PARCEIRO
═══════════════════════════════════════════════ */
function modalPdfParceiroFiltro(allPartos, allPapGineco){
  const wrap=el(`<div></div>`);
  const mesesDisp=new Set();
  allPartos.forEach(p=>{
    const ref=p.parto.realizado&&p.parto.data?parseDate(p.parto.data):calcDPP(p.dum,p.dppManual);
    if(ref) mesesDisp.add(`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`);
  });
  allPapGineco.forEach(g=>{
    const ref=g.dataChecagem?parseDate(g.dataChecagem):null;
    if(ref) mesesDisp.add(`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`);
  });
  const mesesOrd=[...mesesDisp].sort();
  const anos=[...new Set(mesesOrd.map(m=>m.split('-')[0]))].sort();
  const medicos=[...new Set([...allPartos.map(p=>p.parto.nomeMedicoParceiro),...allPapGineco.map(g=>g.papNomeMedico)].filter(Boolean))].sort();

  let selAnos=new Set(), selMeses=new Set(), selSemana='', selMedico='';

  const rerender=()=>{
    const mesesFiltrados=selAnos.size>0?mesesOrd.filter(m=>selAnos.has(m.split('-')[0])):mesesOrd;
    let semanasDisp=[];
    if(selMeses.size>0){
      const wkSet=new Set();
      const addWk=(ref)=>{if(!ref)return;const m=`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`;if(!selMeses.has(m))return;wkSet.add(Math.floor((ref.getDate()-1)/7)+1);};
      allPartos.forEach(p=>addWk(p.parto.realizado&&p.parto.data?parseDate(p.parto.data):calcDPP(p.dum,p.dppManual)));
      allPapGineco.forEach(g=>addWk(g.dataChecagem?parseDate(g.dataChecagem):null));
      semanasDisp=[...wkSet].sort((a,b)=>a-b).map(w=>({key:'sem'+w,label:`Semana ${w} (dias ${((w-1)*7)+1}–${Math.min(w*7,31)})`}));
    }
    const {lp,lg}=aplicarFiltrosPdf(allPartos,allPapGineco,selAnos,selMeses,selSemana,selMedico);
    wrap.innerHTML=`
      <div class="modal-head">
        <div><h2>Exportar PDF</h2><p class="muted-x">Selecione os filtros ou exporte tudo</p></div>
        <button class="close-x">✕</button>
      </div>
      ${medicos.length>0?`
      <div style="margin-bottom:16px;">
        <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">MÉDICO</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${medicos.map(m=>`<button class="btn btn-sm ${selMedico===m?'btn-primary':'btn-secondary'}" data-medico="${m}">${m}</button>`).join('')}
        </div>
      </div>`:''}
      <div style="margin-bottom:16px;">
        <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">ANO</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${anos.map(a=>`<button class="btn btn-sm ${selAnos.has(a)?'btn-primary':'btn-secondary'}" data-ano="${a}">${a}</button>`).join('')}
        </div>
      </div>
      <div style="margin-bottom:16px;">
        <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">MÊS</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${mesesFiltrados.map(m=>{const[y,mo]=m.split('-');const label=new Date(Number(y),Number(mo)-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});return`<button class="btn btn-sm ${selMeses.has(m)?'btn-primary':'btn-secondary'}" data-mes="${m}">${label}</button>`;}).join('')}
        </div>
      </div>
      ${semanasDisp.length>0?`
      <div style="margin-bottom:16px;">
        <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">SEMANA <span style="font-weight:400;">(opcional)</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${semanasDisp.map(s=>`<button class="btn btn-sm ${selSemana===s.key?'btn-primary':'btn-secondary'}" data-sem="${s.key}">${s.label}</button>`).join('')}
        </div>
      </div>`:''}
      <div style="background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--ink-muted);">
        ${selAnos.size===0&&selMeses.size===0&&!selMedico?
          `📄 PDF com <strong style="color:var(--ink);">todos os registros</strong> (${allPartos.length+allPapGineco.length} no total)`:
          `📄 PDF com <strong style="color:var(--ink);">${lp.length} gestante${lp.length!==1?'s':''}</strong> e <strong style="color:var(--ink);">${lg.length} conf. Pap</strong>`}
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" id="btn-gerar-pdf">📄 Gerar PDF</button>
        <button class="btn btn-secondary" id="btn-limpar-filtros-pdf">Limpar filtros</button>
      </div>
    `;
    wrap.querySelector('.close-x').onclick=()=>{state.modal=null;render();};
    wrap.querySelectorAll('[data-medico]').forEach(b=>b.onclick=()=>{selMedico=selMedico===b.dataset.medico?'':b.dataset.medico;rerender();});
    wrap.querySelectorAll('[data-ano]').forEach(b=>b.onclick=()=>{if(selAnos.has(b.dataset.ano))selAnos.delete(b.dataset.ano);else selAnos.add(b.dataset.ano);selSemana='';rerender();});
    wrap.querySelectorAll('[data-mes]').forEach(b=>b.onclick=()=>{if(selMeses.has(b.dataset.mes))selMeses.delete(b.dataset.mes);else selMeses.add(b.dataset.mes);selSemana='';rerender();});
    wrap.querySelectorAll('[data-sem]').forEach(b=>b.onclick=()=>{selSemana=selSemana===b.dataset.sem?'':b.dataset.sem;rerender();});
    wrap.querySelector('#btn-limpar-filtros-pdf').onclick=()=>{selAnos=new Set();selMeses=new Set();selSemana='';selMedico='';rerender();};
    wrap.querySelector('#btn-gerar-pdf').onclick=()=>{
      const{lp,lg,resumo}=aplicarFiltrosPdf(allPartos,allPapGineco,selAnos,selMeses,selSemana,selMedico);
      exportarPdfParceiro(lp,lg,selMeses,selMedico,resumo,{anos:selAnos,meses:selMeses,semana:selSemana,medico:selMedico});
      state.modal=null;render();
    };
  };
  rerender();
  return wrap;
}

function aplicarFiltrosPdf(allPartos,allPapGineco,selAnos,selMeses,selSemana,selMedico){
  const inPeriod=(ref)=>{
    if(!ref) return selAnos.size===0&&selMeses.size===0;
    const ano=String(ref.getFullYear());
    const mes=`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`;
    const wk='sem'+(Math.floor((ref.getDate()-1)/7)+1);
    if(selAnos.size>0&&!selAnos.has(ano)) return false;
    if(selMeses.size>0&&!selMeses.has(mes)) return false;
    if(selSemana&&selSemana!==wk) return false;
    return true;
  };
  const lp=allPartos.filter(p=>inPeriod(p.parto.realizado&&p.parto.data?parseDate(p.parto.data):calcDPP(p.dum,p.dppManual))&&(!selMedico||p.parto.nomeMedicoParceiro===selMedico));
  const lg=allPapGineco.filter(g=>inPeriod(g.dataChecagem?parseDate(g.dataChecagem):null)&&(!selMedico||g.papNomeMedico===selMedico));
  const fp=p=>p.parto.funcoesParceiro||{};
  const resumo={total:lp.length,apresentacao:lp.filter(p=>fp(p).apresentacao).length,inducao:lp.filter(p=>fp(p).inducao).length,conducao:lp.filter(p=>fp(p).conducao).length,auxiliar:lp.filter(p=>fp(p).auxiliar).length,titular:lp.filter(p=>fp(p).titular).length,visita1:lp.filter(p=>fp(p).visita1).length,visita2:lp.filter(p=>fp(p).visita2).length,confPap:lg.length};
  return {lp,lg,resumo};
}

loadAll();
</script>
