.btn-primary:hover{background:var(--teal-dark)}.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border)}.btn-secondary:hover{background:#F1EEE6}.btn-brick{background:var(--brick);color:#fff}.btn-danger{background:var(--alert);color:#fff}.btn-ok{background:var(--ok);color:#fff}.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:16px}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}@media(max-width:900px){.grid-3,.grid-2{grid-template-columns:1fr}}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}.stat-card .num{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--teal-dark);line-height:1}.stat-card .label{font-size:12.5px;color:var(--ink-muted);margin-top:6px}.stat-card .sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px}.section-title{font-size:15px;margin:28px 0 10px;color:var(--teal-dark)}.section-title:first-child{margin-top:0}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}td{padding:9px 10px;border-bottom:1px solid #EEEAE0;vertical-align:middle}tr:hover td{background:#FBFAF7}.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}.tag-teal{background:var(--teal-light);color:var(--teal-dark)}.tag-brick{background:var(--brick-light);color:var(--brick)}.tag-alert{background:var(--alert-light);color:var(--alert)}.tag-warn{background:var(--warn-light);color:var(--warn)}.tag-ok{background:var(--ok-light);color:var(--ok)}.tag-muted{background:#EFEBE2;color:var(--ink-muted)}.empty{padding:40px 20px;text-align:center;color:var(--ink-muted)}.empty h3{color:var(--ink);margin-bottom:6px}.gest-timeline{position:relative;height:26px;background:#EFEBE2;border-radius:6px;overflow:hidden;margin:6px 0}.gest-seg{position:absolute;top:0;height:100%}.gest-marker{position:absolute;top:-3px;width:2px;height:32px;background:var(--ink);opacity:.55}.gest-marker-label{position:absolute;top:-16px;font-size:9.5px;color:var(--ink-muted);white-space:nowrap;transform:translateX(-50%)}.gest-now{position:absolute;top:-4px;width:12px;height:34px;background:transparent}.gest-now::after{content:'';position:absolute;left:50%;top:0;width:3px;height:100%;background:var(--teal-dark);transform:translateX(-50%);border-radius:2px}.gest-now-label{position:absolute;top:-16px;font-size:10px;font-weight:700;color:var(--teal-dark);transform:translateX(-50%);white-space:nowrap}.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}@media(max-width:900px){.month-grid{grid-template-columns:repeat(3,1fr)}}.month-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s}.month-card:hover{border-color:var(--teal)}.month-card.current{border-color:var(--teal);background:var(--teal-light)}.month-card.past{opacity:.6}.month-card .mc-label{font-size:11px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em}.month-card .mc-count{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--teal-dark);line-height:1;margin:4px 0}.month-card .mc-names{font-size:11px;color:var(--ink-muted);line-height:1.6}.month-card.expanded .mc-names{max-height:none}.overlay{position:fixed;inset:0;background:rgba(30,28,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.modal{background:var(--surface);border-radius:14px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;padding:26px 28px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.close-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-muted);line-height:1}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13.5px;background:#FBFAF7}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:0;background:#fff}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEEAE0}.checkrow:last-child{border-bottom:none}.checkrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);flex-shrink:0}.checkrow .ct{flex:1}.checkrow .ct .t{font-weight:600;font-size:13px}.checkrow .ct .d{font-size:11.5px;color:var(--ink-muted)}.checkrow .dt{width:155px}.checkrow .dt input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit;background:#FBFAF7}.type-switch{display:flex;gap:8px;margin-bottom:18px}.type-switch button{flex:1;padding:14px;border-radius:9px;border:1.5px solid var(--border);background:#FBFAF7;cursor:pointer;font-weight:600;font-size:13.5px;text-align:left;font-family:inherit}.type-switch button.sel{border-color:var(--teal);background:var(--teal-light);color:var(--teal-dark)}.type-switch small{display:block;font-weight:400;color:var(--ink-muted);font-size:11px;margin-top:2px}.hist-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #EEEAE0;font-size:12.5px;align-items:center}.hist-item:last-child{border-bottom:none}.banner{padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}.banner-alert{background:var(--alert-light);color:var(--alert)}.banner-warn{background:var(--warn-light);color:var(--warn)}.banner-note{background:var(--teal-light);color:var(--teal-dark)}.toast{position:fixed;bottom:24px;right:24px;background:var(--teal-dark);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2)}.link-btn{background:none;border:none;color:var(--teal);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;font-family:inherit}.muted-x{color:var(--ink-muted);font-size:12px}.card-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--border)}.card-section-title:first-child{margin-top:0;padding-top:0;border-top:none}.parto-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ok-light);color:var(--ok);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;margin-bottom:12px}</style>
</head>
<body>
<div id="app"></div>
<script>
/* SEED_PATIENTS removido — dados carregados do Sheets ou localStorage */
const SEED_PATIENTS = [];


let state = {
  view: 'dashboard',
  obstetric: [],
  gyneco: [],
  settings: {
    metaAnualPartos: 60,
    valorConsultaObstetrica: 0,
    valorConsultaGineco: 0,
    pin: '',
    appsScriptUrl: 'https://script.google.com/macros/s/AKfycbylSTvxHReIjEz-F_5o8kLbo9DcQCKYJ1E9BbfJhRZ4xmtvMpKo1oGVYY-Ljtn2NpfY/exec',
  },
  modal: null,
  loading: true,
  novaPacienteTipo: null,
  toast: null,
  unlocked: false,
  pinError: false,
  expandedMonth: null,
  syncStatus: 'off', // 'off' | 'ok' | 'err'
  monthYearFilter: Math.max(new Date().getFullYear(), 2026),
};

const KEY_OBST = 'patients-obstetric';
const KEY_GIN  = 'patients-gyneco';
const KEY_SET  = 'settings';


function newObstPatient(){
  return {
    id: crypto.randomUUID(),
    nome: '', telefone: '', dum: '',
    cadastradoEm: isoDate(today()),
    retornoMarcado: '',
    interesseConfirmado: false,
    dataApresParc: '',
    apresentadoParceiro: false, dataApresentacao: '',
    valorContrato: 0,
    negociacao: '',
    contratoAssinado: false, dataContrato: '',
    formaPagamento: '',
    entrada: 0, dataEntrada: '',
    pgtoFinalizado: false,
    notaFiscalEnviada: false,
    parto: { realizado: false, data: '', hospital: '', equipObstetrica: '', viaParto: '', auxilio: false, auxilioNome: '', medicoTitular: '', observacao: '', temMedicoParceiro: false, nomeMedicoParceiro: '', funcoesParceiro: {apresentacao:false,inducao:false,conducao:false,auxiliar:false,titular:false,visita1:false,visita2:false,outros:''}, parceiroAssinou: false, dataAssinaturaParceiro: '' },
    posParto: { duasSemanas:{feita:false,data:''}, quarentaDias:{feita:false,data:''}, seisMeses:{feita:false,data:''} },
    pagamentos: [],
    numeroContrato: '',
    migradaDeGineco: false,
    dppManual: '',
    desistiu: false,
    dataDesistencia: '',
    motivoDesistencia: '',
  };
}


function migrateObst(p){
  if(!p.parto) p.parto = { realizado: !!p.dataParto, data: p.dataParto||'', hospital:'', equipObstetrica:'', viaParto:'', auxilio:false, auxilioNome:'', observacao:'' };
  if(p.parto.data===undefined) p.parto.data = p.dataParto||'';
  if(p.parto.realizado===undefined) p.parto.realizado = !!p.dataParto;
  if(!p.parto.medicoTitular) p.parto.medicoTitular = '';
  if(p.parto.temMedicoParceiro===undefined) p.parto.temMedicoParceiro = false;
  if(!p.parto.nomeMedicoParceiro) p.parto.nomeMedicoParceiro = '';
  if(!p.parto.funcoesParceiro) p.parto.funcoesParceiro = {apresentacao:false,inducao:false,conducao:false,auxiliar:false,titular:false,visita1:false,visita2:false,outros:''};
  else{if(p.parto.funcoesParceiro.apresentacao===undefined)p.parto.funcoesParceiro.apresentacao=false;if(p.parto.funcoesParceiro.visita1===undefined)p.parto.funcoesParceiro.visita1=false;if(p.parto.funcoesParceiro.visita2===undefined)p.parto.funcoesParceiro.visita2=false;}
  if(p.parto.parceiroAssinou===undefined) p.parto.parceiroAssinou = false;
  if(!p.parto.dataAssinaturaParceiro) p.parto.dataAssinaturaParceiro = '';
  if(p.migradaParaGineco===undefined) p.migradaParaGineco = false;
  if(p.migradaDeGineco===undefined) p.migradaDeGineco = false;
  if(!p.dppManual) p.dppManual = '';
  if(p.desistiu===undefined) p.desistiu = false;
  if(!p.dataDesistencia) p.dataDesistencia = '';
  if(!p.motivoDesistencia) p.motivoDesistencia = '';
  if(!p.pagamentos) p.pagamentos = [];
  if(!p.numeroContrato) p.numeroContrato = '';
  if(!p.negociacao) p.negociacao = '';
  if(!p.formaPagamento) p.formaPagamento = '';
  if(p.entrada===undefined) p.entrada = 0;
  if(!p.dataEntrada) p.dataEntrada = '';
  if(p.pgtoFinalizado===undefined) p.pgtoFinalizado = false;
  if(p.notaFiscalEnviada===undefined) p.notaFiscalEnviada = false;
  if(!p.retornoMarcado) p.retornoMarcado = '';
  if(p.interesseConfirmado===undefined) p.interesseConfirmado = false;
  if(!p.dataApresParc) p.dataApresParc = '';
  if(p.valorContrato===undefined) p.valorContrato = 0;
  if(!p.dataApresentacao) p.dataApresentacao = p.dataApresentacao||'';
  (p.consultas||[]).forEach(c=>{
    if(c.statusPagamento===undefined){ c.statusPagamento = c.pago?'pendente':'isenta'; c.valor = c.valor||(c.pago?(state.settings.valorConsultaObstetrica||0):0); }
  });
  if(!p.posParto) p.posParto = { duasSemanas:{feita:false,data:''}, quarentaDias:{feita:false,data:''}, seisMeses:{feita:false,data:''} };
  // Auto-marcar retornos passados para partos antigos
  if(p.parto.realizado && p.parto.data){
    const dp=parseDate(p.parto.data);
    if(dp){
      const dias=diffDays(today(),dp);
      if(dias>21 && !p.posParto.duasSemanas.feita)
        p.posParto.duasSemanas = {feita:true, data:''};
      if(dias>50 && !p.posParto.quarentaDias.feita)
        p.posParto.quarentaDias = {feita:true, data:''};
    }
    // Se parto realizado: contrato e apresentação ao parceiro são dados como concluídos
    if(!p.contratoAssinado) p.contratoAssinado = true;
    if(!p.apresentadoParceiro) p.apresentadoParceiro = true;
  }
  return p;
}
function migrateGin(p){
  if(!p.consultas) p.consultas = [{id:crypto.randomUUID(), data:p.ultimaConsulta||p.cadastradoEm, valor:state.settings.valorConsultaGineco||0, statusPagamento:'pendente'}];
  if(!p.papResultado) p.papResultado = ''; // 'normal' | 'alterado' | ''
  if(p.pacienteNotificada===undefined) p.pacienteNotificada = false;
  if(p.migradaDeObstetrica===undefined) p.migradaDeObstetrica = false;
  if(p.migradaParaObstetrica===undefined) p.migradaParaObstetrica = false;
  if(!p.diu) p.diu = {interesse:false,disponivel:false,agendamento:false,insercao:false,pagamento:false,nf:false};
  else {
    if(p.diu.interesse===undefined) p.diu.interesse=false;
    if(p.diu.disponivel===undefined) p.diu.disponivel=false;
    if(p.diu.agendamento===undefined) p.diu.agendamento=false;
    if(p.diu.insercao===undefined) p.diu.insercao=false;
    if(p.diu.pagamento===undefined) p.diu.pagamento=false;
    if(p.diu.nf===undefined) p.diu.nf=false;
  }
  if(!p.papNomeMedico) p.papNomeMedico = '';
  if(p.papMedicoResponsavel===undefined) p.papMedicoResponsavel = false;
  return p;
}


async function fetchFromSheets(showFeedback=false){
  if(!state.settings.appsScriptUrl) return false;
  try{
    state.syncStatus='syncing';
    if(showFeedback) render();
    const res = await fetch(state.settings.appsScriptUrl+'?t='+Date.now(), {method:'GET',redirect:'follow'});
    const data = await res.json();
    if(data.patients && data.patients.length){
      state.obstetric = data.patients.map(migrateObst);
      await saveLocal(KEY_OBST, state.obstetric);
    }
    if(data.gyneco && data.gyneco.length){
      state.gyneco = data.gyneco.map(migrateGin);
      await saveLocal(KEY_GIN, state.gyneco);
    }
    const total = (data.patients||[]).length + (data.gyneco||[]).length;
    if(total > 0){
      state.syncStatus='ok';
      if(showFeedback) showToast('✓ Sheets atualizado: '+( data.patients||[]).length+' gestantes, '+(data.gyneco||[]).length+' ginecológicas.');
      return true;
    }
    state.syncStatus='err';
    if(showFeedback) showToast('Sheets retornou vazio. Verifique a planilha.');
    return false;
  }catch(e){
    state.syncStatus='err';
    if(showFeedback) showToast('Não foi possível conectar ao Sheets. Verifique a URL.');
    console.log('Sheets fetch error:', e);
    return false;
  }
}

async function loadAll(){
  // Load local first (instant)
  try{ const o = await window.storage.get(KEY_OBST,true); state.obstetric = o&&JSON.parse(o.value).length?JSON.parse(o.value):[]; }catch(e){ state.obstetric=[]; }
  try{ const g = await window.storage.get(KEY_GIN,true); state.gyneco = g?JSON.parse(g.value):[]; }catch(e){ state.gyneco=[]; }
  try{ const ls=localStorage.getItem(KEY_SET); if(ls){ const saved=JSON.parse(ls); state.settings={...state.settings,...saved}; if(!state.settings.appsScriptUrl) state.settings.appsScriptUrl='https://script.google.com/macros/s/AKfycbylSTvxHReIjEz-F_5o8kLbo9DcQCKYJ1E9BbfJhRZ4xmtvMpKo1oGVYY-Ljtn2NpfY/exec'; } }catch(e){}
  try{ const s = await window.storage.get(KEY_SET,true); if(s){ const saved=JSON.parse(s.value); state.settings={...state.settings,...saved}; if(!state.settings.appsScriptUrl) state.settings.appsScriptUrl='https://script.google.com/macros/s/AKfycbylSTvxHReIjEz-F_5o8kLbo9DcQCKYJ1E9BbfJhRZ4xmtvMpKo1oGVYY-Ljtn2NpfY/exec'; } }catch(e){}
  try{ const lg=localStorage.getItem(KEY_GIN); if(lg){ const gd=JSON.parse(lg); if(gd.length&&!state.gyneco.length) state.gyneco=gd; } }catch(e){}

  // Migrate and render immediately with local data
  state.obstetric = state.obstetric.map(migrateObst);
  state.gyneco = state.gyneco.map(migrateGin);
  state.loading = false;
  render();

  // Fetch Sheets in background (non-blocking)
  if(state.settings.appsScriptUrl){
    fetchFromSheets(false).then(ok=>{
      if(ok){
        state.obstetric = state.obstetric.map(migrateObst);
        state.gyneco = state.gyneco.map(migrateGin);
        render();
      }
    });
  } else {
    state.syncStatus='off';
  }
}

async function saveLocal(key, data){
  try{ await window.storage.set(key, JSON.stringify(data), true); }
  catch(e){ /* storage unavailable when running locally */ }
  // localStorage persists between sessions for local file usage
  try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){}
}
async function saveSet(){
  try{ await window.storage.set(KEY_SET,JSON.stringify(state.settings),true); }catch(e){}
  try{ localStorage.setItem(KEY_SET,JSON.stringify(state.settings)); }catch(e){}
}

async function syncToSheets(action, payload){
  if(!state.settings.appsScriptUrl) return;
  try{
    await fetch(state.settings.appsScriptUrl, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action, ...payload})
    });
    state.syncStatus = 'ok';
  }catch(e){ state.syncStatus = 'err'; showToast('Sync com Sheets falhou. Dados salvos localmente.'); }
}

async function saveObst(){
  await saveLocal(KEY_OBST, state.obstetric);
  // Per-patient sync happens in commitObstEdit
}
async function saveGin(){
  await saveLocal(KEY_GIN, state.gyneco);
}

async function fetchFreshList(key){
  try{ const o = await window.storage.get(key,true); return o?JSON.parse(o.value):[]; }catch(e){ return []; }
}
async function addPatient(key, patient){
  const list = key === KEY_OBST ? [...state.obstetric] : [...state.gyneco];
  list.push(patient);
  await saveLocal(key, list);
  const action = key === KEY_OBST ? 'upsert' : 'upsertGin';
  await syncToSheets(action, {patient});
  return list;
}
async function commitObstEdit(p){
  const idx = state.obstetric.findIndex(x=>x.id===p.id);
  if(idx>=0) state.obstetric[idx]=p; else state.obstetric.push(p);
  await saveLocal(KEY_OBST, state.obstetric);
  await syncToSheets('upsert', {patient: p});
}
async function commitGinEdit(p){
  const idx = state.gyneco.findIndex(x=>x.id===p.id);
  if(idx>=0) state.gyneco[idx]=p; else state.gyneco.push(p);
  await saveLocal(KEY_GIN, state.gyneco);
  await syncToSheets('upsertGin', {patient: p});
}

function openObstetricModal(id){
  state.modal = { type:'detalheObstetrica', id, editMode:false };
  render();
}

const DAY=86400000;
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(s){ if(!s) return null; const d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function fmtDate(d){
  if(!d) return '—';
  if(typeof d==='string') d=parseDate(d);
  else if(!(d instanceof Date)) d=new Date(d);
  if(!d||isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR');
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ return new Date(d.getTime()+n*DAY); }
function diffDays(a,b){ return Math.floor((a.getTime()-b.getTime())/DAY); }
function calcDPP(dumStr,dppManual){ if(dumStr){const dum=parseDate(dumStr);if(dum) return addDays(dum,280);} if(dppManual){const d=parseDate(dppManual);if(d) return d;} return null; }
function calcSemanasNaData(dumStr,dataRef,dppManual){
  let dum=parseDate(dumStr);
  if(!dum&&dppManual){const dpp=parseDate(dppManual);if(dpp) dum=addDays(dpp,-280);}
  if(!dum) return {semanas:0,dias:0};
  const d=diffDays(dataRef,dum);
  return {semanas:Math.max(0,Math.floor(d/7)),dias:Math.max(0,d%7)};
}
function calcDataApresParc(dumStr){
  const dpp=calcDPP(dumStr); if(!dpp) return null;
  return addDays(dpp,-98); // DPP - 98 dias = semana 26
}
function faseDaSemana(semanas){
  if(semanas<28) return {tipo:'mensal',intervalo:30,label:'Mensal'};
  if(semanas<37) return {tipo:'quinzenal',intervalo:15,label:'Quinzenal'};
  return {tipo:'semanal',intervalo:7,label:'Semanal'};
}
function proximaConsultaSugerida(p){
  const hist=p.consultas||[];
  const ultima=hist.length?hist[hist.length-1]:null;
  const dataBase=ultima?parseDate(ultima.data):parseDate(p.cadastradoEm);
  if(!dataBase) return null;
  const {semanas}=calcSemanasNaData(p.dum,dataBase,p.dppManual);
  const fase=faseDaSemana(semanas);
  const proxData=addDays(dataBase,fase.intervalo);
  const {semanas:semanasProx}=calcSemanasNaData(p.dum,proxData,p.dppManual);
  const faseProx=faseDaSemana(semanasProx);
  const pago=calcularPagoAlternado(hist,semanasProx);
  return {data:proxData,semanas:semanasProx,tipo:faseProx.tipo,label:faseProx.label,pago};
}
function calcularPagoAlternado(hist,semanasNovaConsulta){
  if(semanasNovaConsulta<28) return true;
  const pos28=(hist||[]).filter(c=>c.semanas>=28);
  if(pos28.length===0) return true;
  return !pos28[pos28.length-1].pago;
}
function registrarConsultaRealizada(p,dataStr){
  const dataRef=parseDate(dataStr);
  const {semanas}=calcSemanasNaData(p.dum,dataRef,p.dppManual);
  const fase=faseDaSemana(semanas);
  const pago=calcularPagoAlternado(p.consultas,semanas);
  p.consultas.push({id:crypto.randomUUID(),data:dataStr,semanas,tipo:fase.tipo,pago,
    valor:pago?(state.settings.valorConsultaObstetrica||0):0,
    statusPagamento:pago?'pendente':'isenta'});
  p.consultas.sort((a,b)=>a.data.localeCompare(b.data));
}


function alertasObstetrica(p){
  const alerts=[];
  const t=today();
  const {semanas}=calcSemanasNaData(p.dum,t,p.dppManual);
  if(!p.parto.realizado){
    // Contrato
    if(!p.contratoAssinado){
      if(semanas>=24) alerts.push({level:'alert',msg:`⚠️ Contrato em atraso — deveria ter sido assinado até 24 semanas. Gestação atual: ${semanas} semanas.`});
      else if(semanas>=20) alerts.push({level:'warn',msg:`⏰ Contrato não assinado — faltam ${24-semanas} semanas para o prazo (limite: 24 semanas).`});
    }
    // Apresentação ao parceiro
    if(!p.apresentadoParceiro){
      if(semanas>=28) alerts.push({level:'alert',msg:`⚠️ Apresentação ao parceiro em atraso — janela de 24–28 semanas ultrapassada. Gestação atual: ${semanas} semanas.`});
      else if(semanas>=24) alerts.push({level:'warn',msg:`⏰ Apresentar ao médico parceiro — janela ideal: 24–28 semanas. Gestação atual: ${semanas} semanas.`});
    }
  }
  if(p.parto.realizado && p.parto.data){
    const dp=parseDate(p.parto.data);
    const pp=p.posParto;
    const dias=diffDays(t,dp);
    if(dias>=0&&!pp.duasSemanas.feita) alerts.push({level:'warn',msg:`⏰ Retorno de 2 semanas pós-parto${dias<14?' em '+(14-dias)+'d':''}${dias>=14?' — no prazo':''}.`});
    if(dias>=10&&!pp.quarentaDias.feita) alerts.push({level:'warn',msg:`⏰ Retorno de 40 dias pós-parto${dias<40?' em '+(40-dias)+'d':''}${dias>=40?' — no prazo':''}.`});
    if(dias>=150&&!pp.seisMeses.feita) alerts.push({level:'warn',msg:`⏰ Retorno de 6 meses pós-parto${dias<180?' em '+(180-dias)+'d':''}${dias>=180?' — no prazo':''}.`});
  }
  return alerts;
}
function alertasGineco(p){
  const alerts=[];
  const t=today();
  // Papanicolau coletado mas não checado
  if(p.papColetado&&!p.papChecado){
    const dc=parseDate(p.dataColeta);
    const diasEspera = dc ? diffDays(t,dc) : 0;
    if(dc&&diasEspera>=21) alerts.push({level:'warn',msg:`⏰ Papanicolau coletado há ${diasEspera} dias — resultado ainda não conferido.`});
  }
  // Resultado checado: ação necessária
  if(p.papColetado&&p.papChecado){
    if(p.papResultado==='alterado'&&!p.retornoMarcado)
      alerts.push({level:'alert',msg:'⚠️ Papanicolau ALTERADO — agendar retorno urgente com a Dra. Amanda.'});
    if(p.papResultado==='normal'&&!p.pacienteNotificada)
      alerts.push({level:'warn',msg:'⏰ Papanicolau normal — enviar devolutiva positiva para a paciente.'});
  }
  // Consulta em atraso
  if(p.ultimaConsulta){
    const prox=proximoRetornoGineco(p);
    if(prox){
      const dias=diffDays(prox,t);
      const intervaloLabel=({'30dias':'30 dias','3meses':'3 meses','6meses':'6 meses','1ano':'1 ano'}[p.seguimento]||'1 ano');
      if(dias<0) alerts.push({level:'alert',msg:`⚠️ Retorno de ${intervaloLabel} em atraso — deveria ter retornado em ${fmtDate(prox)} (${Math.abs(dias)} dias atrás).`});
      else if(dias<=30) alerts.push({level:'warn',msg:`⏰ Retorno de seguimento (${intervaloLabel}) previsto para ${fmtDate(prox)} — faltam ${dias} dias.`});
    }
  }
  return alerts;
}
function statusDIU(p){
  const d=p.diu||{};
  if(!d.interesse) return null;
  if(d.insercao&&(!d.pagamento||!d.nf)) return {level:'warn',label:'💳 Financeiro DIU pendente'};
  if(d.insercao&&d.pagamento&&d.nf) return {level:'ok',label:'✓ DIU concluído'};
  if(d.agendamento) return {level:'warn',label:'⏰ Inserção DIU pendente'};
  if(d.disponivel) return {level:'warn',label:'⏰ Agendamento DIU pendente'};
  return {level:'muted',label:'Aguardando DIU ser disponibilizado'};
}

function proximoRetornoGineco(p){
  const baseStr = p.ultimaConsulta || p.cadastradoEm;
  if(!baseStr) return null;
  const base=parseDate(baseStr);
  if(!base) return null;
  const dias={'30dias':30,'3meses':90,'6meses':182,'1ano':365}[p.seguimento]||365;
  return addDays(base,dias);
}


function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function tag(text,kind){ return `<span class="tag tag-${kind}">${text}</span>`; }
function alertBanner(a){ return `<div class="banner banner-${a.level}">${a.msg}</div>`; }
function gestTimeline(semanas){

}


function renderApp(){
  const root=document.getElementById('app');
  root.innerHTML='';
  if(state.loading){
    root.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;color:var(--ink-muted);font-family:'Fraunces',serif;font-size:16px;">Carregando painel…</div>`;
    return;
  }
  if(state.settings.pin&&!state.unlocked){ root.appendChild(renderLockScreen()); return; }
  root.appendChild(sidebar());
  const main=document.createElement('main');
  if(state.view==='dashboard') main.appendChild(viewDashboard());
  else if(state.view==='gestantes') main.appendChild(viewGestantes());
  else if(state.view==='gineco'){
    try{ main.appendChild(viewGineco()); }
    catch(e){ main.innerHTML=`<div style="padding:20px;"><h3>Erro na aba Ginecológicas</h3><p style="color:var(--alert);">${e.message}</p><pre style="font-size:11px;color:#888;">${e.stack||''}</pre></div>`; }
  }
  else if(state.view==='config') main.appendChild(viewConfig());
  else if(state.view==='parceiro'){
    try{ main.appendChild(viewParceiro()); }
    catch(e){ main.innerHTML=`<div style="padding:20px;"><h3>Erro na aba Médico Parceiro</h3><p style="color:var(--alert);">${e.message}</p><pre style="font-size:11px;">${(e.stack||'').slice(0,400)}</pre></div>`; }
  }
  root.appendChild(main);
  if(state.modal) root.appendChild(renderModal());
  if(state.toast){ root.appendChild(el(`<div class="toast">${state.toast}</div>`)); }
}
function render(){ renderApp(); }

function viewDashboard(){
  const t=today();
  const wrap=el(`<div></div>`);
  const selectedYear = state.monthYearFilter;
  const currentYear = t.getFullYear();
  const yearsAvail = [];
  for(let y=2026;y<=currentYear+1;y++) yearsAvail.push(y);

  // Stats filtered by selected year(s)
  const yearsSet = new Set(state.selectedYears||[selectedYear]);
  const gestantesAtivas = state.obstetric.filter(p=>{
    if(p.parto.realizado) return false;
    if(p.desistiu) return false;
    const dpp=calcDPP(p.dum,p.dppManual);
    if(!dpp) return yearsSet.size===0; // sem DPP: só na visão "todos"
    return yearsSet.has(dpp.getFullYear());
  });
  const partosRealizados = state.obstetric.filter(p=>{
    if(!p.parto.realizado||!p.parto.data) return false;
    const dp=parseDate(p.parto.data);
    return dp&&yearsSet.has(dp.getFullYear());
  }).length;

  // Partos por mês
  // Build month grid for selected years
  const meses=[];
  const sortedYears=[...(state.selectedYears||new Set([selectedYear]))].sort();
  sortedYears.forEach(yr=>{
    for(let i=0;i<12;i++){
      const d=new Date(yr,i,1);
      meses.push({key:`${yr}-${i}`,label:d.toLocaleDateString('pt-BR',{month:'short',year:sortedYears.length>1?'2-digit':undefined}),
        month:i,year:yr,previstos:[],realizados:[]});
    }
  });
  state.obstetric.forEach(p=>{
    if(!p.parto.realizado){
      const dpp=calcDPP(p.dum,p.dppManual); if(!dpp) return;
      const m=meses.find(mm=>mm.month===dpp.getMonth()&&mm.year===dpp.getFullYear()); if(m) m.previstos.push(p.nome);
    } else if(p.parto.data){
      const dp=parseDate(p.parto.data); if(!dp) return;
      const m=meses.find(mm=>mm.month===dp.getMonth()&&mm.year===dp.getFullYear()); if(m) m.realizados.push(p.nome);
    }
  });



  // Alertas
  const alertContrato = gestantesAtivas.filter(p=>{
    const {semanas}=calcSemanasNaData(p.dum,t,p.dppManual); return !p.contratoAssinado&&semanas>=20;
  }).length;
  const alertParceiro = gestantesAtivas.filter(p=>{
    const {semanas}=calcSemanasNaData(p.dum,t,p.dppManual); return !p.apresentadoParceiro&&semanas>=24;
  }).length;
  const alertRetorno = state.obstetric.filter(p=>{
    if(!p.parto.realizado||!p.parto.data) return false;
    const dp=parseDate(p.parto.data); if(!dp) return false;
    const dias=diffDays(t,dp);
    return (dias>=0&&!p.posParto.duasSemanas.feita)||(dias>=10&&!p.posParto.quarentaDias.feita)||(dias>=150&&!p.posParto.seisMeses.feita);
  }).length;

  wrap.innerHTML=`
    <div class="page-head">
      <div><h1>Controle de Partos</h1><p>${t.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</p></div>
    </div>

    <!-- Filtro de ano -->

      <span style="font-size:12px;font-weight:600;color:var(--ink-muted);">ANO:</span>
      <div id="year-btns" style="display:flex;gap:4px;"></div>
    </div>

    <!-- Stats -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
      <div class="card stat-card" style="min-width:150px;flex:0 0 auto;">
        <div class="num">${partosRealizados}</div>
        <div class="label">Partos realizados</div>
      </div>
      <div class="card stat-card" style="min-width:150px;flex:0 0 auto;">
        <div class="num">${gestantesAtivas.length}</div>

      </div>
    </div>

      <h3 class="section-title" style="margin:0;">Partos por mês — ${[...(state.selectedYears||new Set([selectedYear]))].sort().join(' + ')}</h3>

        <span>○ previstos (DPP)</span>
      </div>
    </div>
    <div class="month-grid" id="month-grid" style="margin-bottom:20px;"></div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input id="busca-gestantes" type="text" placeholder="🔍 Buscar paciente..." value="${state.buscaGestantes||''}"
          style="padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;min-width:200px;">
        <button class="btn btn-secondary" id="btn-alerta-contrato" style="position:relative;">
          📄 Contrato Pendente<span id="badge-contrato"></span>
        </button>
        <button class="btn btn-secondary" id="btn-alerta-parceiro" style="position:relative;">
          👥 Apres. Parceiro<span id="badge-parceiro"></span>
        </button>
        <button class="btn btn-secondary" id="btn-fup" style="position:relative;">
          📋 F-Up Pós-Parto<span id="fup-badge"></span>
        </button>
        <button class="btn btn-primary" id="btn-nova">+ Nova gestante</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
      <span style="font-size:12px;font-weight:600;color:var(--ink-muted);">Mês:</span>
      ${mesesPillsHtml}
      ${state.gestantesMeses&&state.gestantesMeses.size>0?`<button class="btn btn-secondary btn-sm" id="clear-filter">✕</button>`:''}
      <button class="btn btn-sm ${state.filtroDeGineco?'btn-primary':'btn-secondary'}" id="btn-filtro-degineco" style="margin-left:4px;">⟳ de gineco${state.filtroDeGineco?' ✓':''}</button>
      <button class="btn btn-sm ${state.filtroDesistencias?'btn-primary':'btn-secondary'}" id="btn-filtro-desist" style="margin-left:4px;">⚠️ Desistências${state.filtroDesistencias?' ✓':''}</button>
    </div>
    <div class="table-wrap" id="tbl"></div>
  `;

  wrap.querySelector('#btn-nova').onclick=()=>{state.modal={type:'novaPaciente'};state.novaPacienteTipo='obstetrica';render();};
  // Pill buttons for month filter
  wrap.querySelectorAll('[data-mes]').forEach(btn=>{
    btn.onclick=()=>{
      if(!state.gestantesMeses) state.gestantesMeses=new Set();
      if(state.gestantesMeses.has(btn.dataset.mes)) state.gestantesMeses.delete(btn.dataset.mes);
      else state.gestantesMeses.add(btn.dataset.mes);
      render();
    };
  });
  const inputBusca=wrap.querySelector('#busca-gestantes');
  if(inputBusca){
    inputBusca.oninput=e=>{
      state.buscaGestantes=e.target.value;
      const q=e.target.value.toLowerCase().trim();
      wrap.querySelectorAll('tr[data-id]').forEach(r=>{
        const nome=(r.querySelector('strong')||{textContent:''}).textContent.toLowerCase();
        r.style.display=!q||nome.includes(q)?'':'none';
      });
    };
    inputBusca.onclick=e=>e.stopPropagation();
  }
  const btnFiltroGineco=wrap.querySelector('#btn-filtro-degineco');
  if(btnFiltroGineco) btnFiltroGineco.onclick=()=>{state.filtroDeGineco=!state.filtroDeGineco;render();};
  const btnFiltroDesist=wrap.querySelector('#btn-filtro-desist');
  if(btnFiltroDesist) btnFiltroDesist.onclick=()=>{state.filtroDesistencias=!state.filtroDesistencias;if(state.filtroDesistencias)state.filtroDeGineco=false;render();};
  const btnClear=wrap.querySelector('#clear-filter');
  if(btnClear) btnClear.onclick=()=>{state.gestantesMeses=new Set();render();};

  // F-Up badge count
  const fupPendCount = state.obstetric.filter(p=>{
    if(!p.parto.realizado||!p.parto.data) return false;
    const dias = diffDays(today(), parseDate(p.parto.data));
    return (dias>=0&&!p.posParto.duasSemanas.feita)||
           (dias>=10&&!p.posParto.quarentaDias.feita)||
           (dias>=150&&!p.posParto.seisMeses.feita);
  }).length;
  const badge = wrap.querySelector('#fup-badge');
  if(fupPendCount>0){
    badge.textContent = fupPendCount;
    badge.style.cssText='display:inline-flex;align-items:center;justify-content:center;background:var(--alert);color:#fff;border-radius:50%;font-size:10px;font-weight:700;width:18px;height:18px;margin-left:6px;';
  }
  // Alert badges
  const t_g=today();
  const alertsC=state.obstetric.filter(p=>{if(p.parto.realizado)return false;const{semanas}=calcSemanasNaData(p.dum,t_g,p.dppManual);return !p.contratoAssinado&&semanas>=20;}).length;
  const alertsP=state.obstetric.filter(p=>{if(p.parto.realizado)return false;const{semanas}=calcSemanasNaData(p.dum,t_g,p.dppManual);return !p.apresentadoParceiro&&semanas>=24;}).length;
  const setBadge=(id,n,color)=>{const b=wrap.querySelector(id);if(b&&n>0){b.textContent=n;b.style.cssText=`display:inline-flex;align-items:center;justify-content:center;background:${color};color:#fff;border-radius:50%;font-size:10px;font-weight:700;width:18px;height:18px;margin-left:6px;`;}};
  setBadge('#badge-contrato',alertsC,'var(--alert)');
  setBadge('#badge-parceiro',alertsP,'var(--warn)');
  wrap.querySelector('#btn-alerta-contrato').onclick=()=>{state.modal={type:'alertaContratos'};render();};
  wrap.querySelector('#btn-alerta-parceiro').onclick=()=>{state.modal={type:'alertaParceiro'};render();};
  wrap.querySelector('#btn-fup').onclick=()=>{state.modal={type:'fupPosParto'};render();};
  const tblWrap=wrap.querySelector('#tbl');
  if(lista.length===0){
    tblWrap.innerHTML=`<div class="empty"><h3>Nenhuma gestante cadastrada</h3><p>Cadastre a primeira consulta de pré-natal.</p></div>`;
  } else {
    const rows=lista.map(p=>{
      const dpp=calcDPP(p.dum,p.dppManual);
      const {semanas}=calcSemanasNaData(p.dum,t,p.dppManual);
      const alerts=alertasObstetrica(p);
      const alertTag=alerts.some(a=>a.level==='alert')?tag('atenção','alert'):(alerts.length?tag('lembrete','warn'):tag('ok','ok'));
      const contratoTag=p.contratoAssinado?tag('ok','ok'):!p.contratoAssinado&&semanas>=24?tag('em atraso','alert'):(semanas>=20?tag('urgente','warn'):tag('pendente','muted'));
      const migradaTag=p.migradaDeGineco?`<span class="tag tag-muted" style="font-size:10px;">⟳ de gineco</span>`:(p.desistiu?`<span class="tag tag-warn" style="font-size:10px;">⚠️ desistência</span>`:'')
      const parcTag=p.apresentadoParceiro?tag('ok','ok'):!p.apresentadoParceiro&&semanas>=28?tag('em atraso','alert'):(semanas>=24?tag('urgente','warn'):tag('pendente','muted'));
      return `<tr data-id="${p.id}" style="cursor:pointer;">
        <td><strong>${p.nome}</strong>${p.numeroContrato?` <span class="muted-x">${p.numeroContrato}</span>`:''} ${migradaTag} ${p.parto.realizado?`<span class="muted-x">(parto ${fmtDate(p.parto.data)})</span>`:''}</td>
        <td>${p.parto.realizado?'—':semanas+' sem.'}</td>
        <td class="mono">${fmtDate(dpp)}</td>
        <td>${contratoTag}</td>
        <td>${parcTag}</td>
        <td>${alertTag}</td>
      </tr>`;
    }).join('');
    tblWrap.innerHTML=`<table><thead><tr><th>Nome</th><th>IG atual</th><th>DPP</th><th>Contrato</th><th>Parceiro</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
    tblWrap.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openObstetricModal(r.dataset.id));
  }
  return wrap;
}



function viewParceiro(){
  const wrap=el(`<div></div>`);
  const t=today();

  // Obstetric patients with partner doctor
  const allPartos=state.obstetric.filter(p=>p.parto.nomeMedicoParceiro)
    .map(migrateObst)
    .sort((a,b)=>{
      const da=parseDate(a.parto.data)||calcDPP(a.dum,a.dppManual)||new Date(0);
      const db=parseDate(b.parto.data)||calcDPP(b.dum,b.dppManual)||new Date(0);
      return db-da;
    });

  // Gyneco patients where doctor confirmed Pap
  const allPapGineco=state.gyneco.filter(g=>g.papMedicoResponsavel&&g.papNomeMedico).map(migrateGin);

  // Unique doctor names
  const nomesUnicos=[...new Set([
    ...allPartos.map(p=>p.parto.nomeMedicoParceiro),
    ...allPapGineco.map(g=>g.papNomeMedico)
  ].filter(Boolean))].sort();

  if(!state.parceiroMeses) state.parceiroMeses=new Set();
  if(state.parceiroNomeFiltro===undefined) state.parceiroNomeFiltro='';
  const nf=state.parceiroNomeFiltro;

  // Month pills from all dates
  const allMeses=new Set();
  allPartos.forEach(p=>{
    const ref=p.parto.realizado&&p.parto.data?parseDate(p.parto.data):calcDPP(p.dum,p.dppManual);
    if(ref) allMeses.add(`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`);
  });
  allPapGineco.forEach(g=>{
    const ref=g.dataChecagem?parseDate(g.dataChecagem):null;
    if(ref) allMeses.add(`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`);
  });
  const mesesOrd=[...allMeses].sort();
  const pillsHtml=mesesOrd.map(m=>{
    const [y,mo]=m.split('-');
    const d=new Date(Number(y),Number(mo)-1,1);
    const label=d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    return `<button class="btn btn-sm ${state.parceiroMeses.has(m)?'btn-primary':'btn-secondary'}" data-mes-parc="${m}">${label}</button>`;
  }).join('');

  const inMes=(date)=>{
    if(!state.parceiroMeses.size) return true;
    if(!date) return false;
    const key=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
    return state.parceiroMeses.has(key);
  };

  let listaPartos=allPartos
    .filter(p=>!nf||p.parto.nomeMedicoParceiro===nf)
    .filter(p=>inMes(p.parto.realizado&&p.parto.data?parseDate(p.parto.data):calcDPP(p.dum,p.dppManual)));
  let listaPap=allPapGineco
    .filter(g=>!nf||g.papNomeMedico===nf)
    .filter(g=>inMes(g.dataChecagem?parseDate(g.dataChecagem):null));

  // Summary
  const fp=p=>p.parto.funcoesParceiro||{};
  const resumo={
    total:        listaPartos.length,
    apresentacao: listaPartos.filter(p=>fp(p).apresentacao).length,
    inducao:      listaPartos.filter(p=>fp(p).inducao).length,
    conducao:     listaPartos.filter(p=>fp(p).conducao).length,
    auxiliar:     listaPartos.filter(p=>fp(p).auxiliar).length,
    titular:      listaPartos.filter(p=>fp(p).titular).length,
    visita1:      listaPartos.filter(p=>fp(p).visita1).length,
    visita2:      listaPartos.filter(p=>fp(p).visita2).length,
    confPap:      listaPap.length,
  };

  // Weekly breakdown
  const getWeekLabel=(d,wk)=>{
    const d1=new Date(d.getFullYear(),d.getMonth(),1+wk*7);
    const d2=new Date(Math.min(new Date(d.getFullYear(),d.getMonth()+1,0).getTime(),new Date(d.getFullYear(),d.getMonth(),7+wk*7).getTime()));
    return `${d1.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}–${d2.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}`;
  };
  const semanas={};
  listaPartos.forEach(p=>{
    const d=parseDate(p.parto.data)||calcDPP(p.dum,p.dppManual); if(!d) return;
    const wk=Math.floor((d.getTime()-new Date(d.getFullYear(),d.getMonth(),1).getTime())/(7*86400000));
    const key=`${d.getFullYear()}-${d.getMonth()}-${wk}`;
    if(!semanas[key]) semanas[key]={label:getWeekLabel(d,wk),sort:d.getTime(),apresentacao:0,inducao:0,conducao:0,auxiliar:0,titular:0,visita1:0,visita2:0,confPap:0,total:0};
    const f=fp(p);
    if(f.apresentacao)semanas[key].apresentacao++;if(f.inducao)semanas[key].inducao++;
    if(f.conducao)semanas[key].conducao++;if(f.auxiliar)semanas[key].auxiliar++;
    if(f.titular)semanas[key].titular++;if(f.visita1)semanas[key].visita1++;
    if(f.visita2)semanas[key].visita2++;semanas[key].total++;
  });
  listaPap.forEach(g=>{
    const d=g.dataChecagem?parseDate(g.dataChecagem):null; if(!d) return;
    const wk=Math.floor((d.getTime()-new Date(d.getFullYear(),d.getMonth(),1).getTime())/(7*86400000));
    const key=`${d.getFullYear()}-${d.getMonth()}-${wk}`;
    if(!semanas[key]) semanas[key]={label:getWeekLabel(d,wk),sort:d.getTime(),apresentacao:0,inducao:0,conducao:0,auxiliar:0,titular:0,visita1:0,visita2:0,confPap:0,total:0};
    semanas[key].confPap++;
  });
  const semanasOrdenadas=Object.values(semanas).sort((a,b)=>b.sort-a.sort);

  const hasFilters=nf||state.parceiroMeses.size>0;
  const funcLabel=f=>{if(!f)return'—';const l=[];if(f.apresentacao)l.push('Apres.');if(f.inducao)l.push('Ind.');if(f.conducao)l.push('Cond.');if(f.auxiliar)l.push('Aux.');if(f.titular)l.push('Tit.');if(f.visita1)l.push('1ªV');if(f.visita2)l.push('2ªV');if(f.outros)l.push(f.outros);return l.join(', ')||'—';};

  const rowsPartos=listaPartos.map(p=>`<tr data-open="${p.id}" style="cursor:pointer;">
    <td><strong>${p.nome}</strong></td>
    <td>${p.parto.nomeMedicoParceiro||'—'}</td>
    <td class="mono">${p.parto.realizado?fmtDate(p.parto.data):(fmtDate(calcDPP(p.dum,p.dppManual))+' <span style="color:var(--ink-muted);font-size:11px;">(prev.)</span>')}</td>
    <td style="font-size:12px;">${funcLabel(fp(p))}</td>
    <td>${p.parto.viaParto||'—'}</td>
  </tr>`).join('');

  const rowsPap=listaPap.map(g=>`<tr data-gopen="${g.id}" style="cursor:pointer;">
    <td><strong>${g.nome}</strong></td>
    <td>${g.papNomeMedico||'—'}</td>
    <td class="mono">${fmtDate(g.dataChecagem)||'—'}</td>
    <td>${g.papResultado==='normal'?tag('Normal','ok'):g.papResultado==='alterado'?tag('Alterado','alert'):tag('—','muted')}</td>
  </tr>`).join('');

  wrap.innerHTML=`
    <div class="page-head">
      <div><h1>Médico Parceiro</h1>
        <p>${allPartos.length} gestante${allPartos.length!==1?'s':''} · ${allPapGineco.length} conf. Pap${listaPartos.length+listaPap.length!==(allPartos.length+allPapGineco.length)?' · '+(listaPartos.length+listaPap.length)+' exibidas':''}</p>
      </div>
      <button class="btn btn-secondary" id="btn-export-pdf">📄 Exportar PDF</button>
    </div>

    <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px;">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:6px;">Médico parceiro</div>
        <select id="filtro-nome" style="padding:7px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;min-width:200px;">
          <option value="">Todos</option>
          ${nomesUnicos.map(n=>`<option value="${n}" ${nf===n?'selected':''}>${n}</option>`).join('')}
        </select>
      </div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:6px;">Mês</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          ${pillsHtml||'<span class="muted-x" style="font-size:12px;">Sem atividades cadastradas</span>'}
          ${state.parceiroMeses.size>0?`<button class="btn btn-secondary btn-sm" id="clear-parc">✕</button>`:''}
        </div>
      </div>
      ${hasFilters?`<div style="align-self:flex-end;"><button class="btn btn-secondary btn-sm" id="clear-all-parc">Limpar filtros</button></div>`:''}
    </div>

    ${hasFilters&&(listaPartos.length>0||listaPap.length>0)?`
    <div class="card" style="margin-bottom:16px;background:var(--teal-light);">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-dark);margin-bottom:12px;">
        Resumo${nf?' — '+nf:''}
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(42,136,128,.2);">
        ${[['total','partos'],['apresentacao','apres.'],['inducao','induções'],['conducao','conduções'],['auxiliar','auxiliar'],['titular','titular'],['visita1','1ª visita'],['visita2','2ª visita'],['confPap','conf. Pap']].filter(([k])=>resumo[k]>0).map(([k,label])=>
          `<div style="text-align:center;"><div style="font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--teal-dark);">${resumo[k]}</div><div style="font-size:11px;color:var(--teal-dark);">${label}</div></div>`
        ).join('')}
      </div>
      ${semanasOrdenadas.map(s=>{
        const parts=[];
        if(s.apresentacao) parts.push('apres. '+s.apresentacao);
        if(s.inducao) parts.push('ind. '+s.inducao);
        if(s.conducao) parts.push('cond. '+s.conducao);
        if(s.auxiliar) parts.push('aux. '+s.auxiliar);
        if(s.titular) parts.push('tit. '+s.titular);
        if(s.visita1) parts.push('1ªv. '+s.visita1);
        if(s.visita2) parts.push('2ªv. '+s.visita2);
        if(s.confPap) parts.push('Pap '+s.confPap);
        return `<div style="display:flex;align-items:baseline;gap:12px;padding:4px 0;border-bottom:1px solid rgba(42,136,128,.1);">
          <span style="font-size:11px;color:var(--teal-dark);font-weight:600;min-width:120px;">${s.label}</span>
          
          <span style="font-size:12px;color:var(--teal-dark);">${parts.join(' · ')||'—'}</span>
        </div>`;
      }).join('')}
    </div>`:''}

    ${listaPap.length>0?`
    <h3 class="section-title">Pacientes Gineco</h3>
    <div class="table-wrap" style="margin-bottom:20px;">
      <table>
        <thead><tr><th>Paciente</th><th>Médico</th><th>Data conferência</th><th>Resultado</th></tr></thead>
        <tbody>${rowsPap}</tbody>
      </table>
    </div>`:''}

    ${listaPartos.length>0?`
    <h3 class="section-title">Gestantes</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Paciente</th><th>Médico Parceiro</th><th>Data / DPP</th><th>Funções</th><th>Via</th></tr></thead>
        <tbody>${rowsPartos}</tbody>
      </table>
    </div>`:''}

    ${listaPartos.length===0&&listaPap.length===0?`<div class="empty"><h3>Nenhum registro encontrado</h3><p>${allPartos.length===0&&allPapGineco.length===0?'Cadastre o médico parceiro na ficha da paciente para que apareça aqui.':'Tente ajustar os filtros.'}</p></div>`:''}
  `;

  wrap.querySelector('#filtro-nome').onchange=e=>{state.parceiroNomeFiltro=e.target.value;render();};
  wrap.querySelectorAll('[data-mes-parc]').forEach(btn=>{
    btn.onclick=()=>{
      const mv=btn.dataset.mesParc;
      if(state.parceiroMeses.has(mv)) state.parceiroMeses.delete(mv); else state.parceiroMeses.add(mv);
      render();
    };
  });
  const btnClearParc=wrap.querySelector('#clear-parc');
  if(btnClearParc) btnClearParc.onclick=()=>{state.parceiroMeses=new Set();render();};
  const btnClearAll=wrap.querySelector('#clear-all-parc');
  if(btnClearAll) btnClearAll.onclick=()=>{state.parceiroMeses=new Set();state.parceiroNomeFiltro='';render();};
  wrap.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>openObstetricModal(r.dataset.open));
  wrap.querySelectorAll('[data-gopen]').forEach(r=>r.onclick=()=>openGinecoModal(r.dataset.gopen));
  const btnPdf=wrap.querySelector('#btn-export-pdf');
  if(btnPdf) btnPdf.onclick=()=>{
    state.modal={type:'pdfParceiroFiltro',allPartos,allPapGineco};render();
  };
  return wrap;
}

function viewGineco(){
  const wrap=el(`<div></div>`);
  const t=today();

  // Month/year filter (same logic as gestantes)
  const mesFilter = state.ginecoMesFilter || '';
  const anoFilter = state.ginecoAnoFilter || t.getFullYear();
  const yearsAvail = [];
  for(let y=2026;y<=t.getFullYear()+1;y++) yearsAvail.push(y);

  // Build month pills from gyneco data
  if(!state.ginecoMeses) state.ginecoMeses = new Set();
  if(state.buscaGineco===undefined) state.buscaGineco='';
  const allMesesGin = new Set();
  state.gyneco.forEach(p=>{
    const ref = p.ultimaConsulta ? parseDate(p.ultimaConsulta) : (p.cadastradoEm ? parseDate(p.cadastradoEm) : null);
    if(ref) allMesesGin.add(`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`);
  });
  const mesesOrdGin = [...allMesesGin].sort();
  const mesesPillsGinHtml = mesesOrdGin.map(m=>{
    const [y,mo]=m.split('-');
    const d=new Date(Number(y),Number(mo)-1,1);
    const label=d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
    const sel=state.ginecoMeses.has(m);
    return `<button class="btn btn-sm ${sel?'btn-primary':'btn-secondary'}" data-mes-gin="${m}">${label}</button>`;
  }).join('');

  let lista=[...state.gyneco].map(migrateGin).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  if(state.buscaGineco) lista=lista.filter(p=>(p.nome||'').toLowerCase().includes(state.buscaGineco.toLowerCase()));
  if(state.ginecoMeses.size>0){
    lista=lista.filter(p=>{
      const ref=p.ultimaConsulta?parseDate(p.ultimaConsulta):(p.cadastradoEm?parseDate(p.cadastradoEm):null);
      if(!ref) return false;
      const key=`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`;
      return state.ginecoMeses.has(key);
    });
  }
  if(state.filtroDeObstetrica) lista=lista.filter(p=>p.migradaDeObstetrica);

  // Panels
  const papPendentes = state.gyneco.map(migrateGin).filter(p=>p.papColetado&&!p.papChecado);
  const acaoNecessaria = state.gyneco.map(migrateGin).filter(p=>p.papColetado&&p.papChecado&&(
    (p.papResultado==='alterado'&&!p.retornoMarcado)||(p.papResultado==='normal'&&!p.pacienteNotificada)
  ));
  const retornoPendente = state.gyneco.map(migrateGin).filter(p=>{
    const prox=proximoRetornoGineco(p); return prox&&diffDays(prox,t)<0;
  }).length;

  wrap.innerHTML=`
    <div class="page-head">
      <div><h1>Ginecológicas</h1><p>${state.ginecoMeses&&state.ginecoMeses.size>0?lista.length+' selecionadas · ':''} ${state.gyneco.length} total</p></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input id="busca-gineco" type="text" placeholder="🔍 Buscar paciente..." value="${state.buscaGineco||''}"
          style="padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;min-width:200px;">
        <button class="btn btn-secondary" id="btn-fup-gineco" style="position:relative;">
          📋 F-Up Retorno
          <span id="fup-gin-badge"></span>
        </button>
        <button class="btn btn-secondary" id="btn-fup-diu" style="position:relative;">
          🔵 F-Up DIU
          <span id="fup-diu-badge"></span>
        </button>
        <button class="btn btn-primary" id="btn-nova">+ Nova paciente</button>
      </div>
    </div>

    <!-- Filtros -->
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
      <span style="font-size:11.5px;color:var(--ink-muted);font-weight:600;">Mês:</span>
      <div id="mes-pills-gin" style="display:flex;gap:4px;flex-wrap:wrap;">${mesesPillsGinHtml}</div>
      ${state.ginecoMeses&&state.ginecoMeses.size>0?`<button class="btn btn-secondary btn-sm" id="clear-filter-gin">✕</button>`:''}
      <button class="btn btn-sm ${state.filtroDeObstetrica?'btn-primary':'btn-secondary'}" id="btn-filtro-deobst" style="margin-left:4px;">⟳ de obstetrícia${state.filtroDeObstetrica?' ✓':''}</button>
    </div>

    ${papPendentes.length||acaoNecessaria.length?`<h3 class="section-title" style="margin-top:0;">Controle Exame Papanicolau</h3>`:''}

    ${papPendentes.length?`
    <div class="card" style="margin-bottom:12px;border-left:4px solid var(--warn);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <strong style="color:var(--warn);">⏰ Papanicolau aguardando checagem (${papPendentes.length})</strong>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${papPendentes.map(p=>{
          const dc=parseDate(p.dataColeta); const dias=dc?diffDays(t,dc):0;
          return `<div style="background:var(--warn-light);border-radius:6px;padding:6px 10px;font-size:12.5px;cursor:pointer;" data-ginid="${p.id}">
            <strong>${p.nome.split(' ').slice(0,2).join(' ')}</strong><br>
            <span style="color:var(--ink-muted);">Há ${dias} dias</span></div>`;
        }).join('')}
      </div>
    </div>`:''}

    ${acaoNecessaria.length?`
    <div class="card" style="margin-bottom:12px;border-left:4px solid var(--alert);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <strong style="color:var(--alert);">⚠️ Ação necessária — resultado checado (${acaoNecessaria.length})</strong>
      </div>
      ${acaoNecessaria.map(p=>{
        const isAlt=p.papResultado==='alterado';
        return `<div style="display:flex;justify-content:space-between;align-items:center;background:${isAlt?'var(--alert-light)':'var(--warn-light)'};border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:pointer;" data-ginid="${p.id}">
          <strong>${p.nome.split(' ').slice(0,2).join(' ')}</strong>
          <span style="font-size:12px;color:${isAlt?'var(--alert)':'var(--warn)'};">${isAlt?'🔴 Agendar retorno urgente':'🟡 Enviar devolutiva positiva'}</span>
        </div>`;
      }).join('')}
    </div>`:''}

    <h3 class="section-title" style="margin-top:${papPendentes.length||acaoNecessaria.length?'8px':'0'};">Todas as pacientes</h3>
    <div class="table-wrap" id="tbl"></div>
  `;

  // F-up badge
  const pendGin = state.gyneco.map(migrateGin).filter(p=>{
    if(p.retornoMarcado) return false;
    const prox=proximoRetornoGineco(p); return prox&&diffDays(prox,t)<0;
  }).length;
  const badge=wrap.querySelector('#fup-gin-badge');
  if(pendGin>0){badge.textContent=pendGin;badge.style.cssText='display:inline-flex;align-items:center;justify-content:center;background:var(--alert);color:#fff;border-radius:50%;font-size:10px;font-weight:700;width:18px;height:18px;margin-left:6px;';}

  const inputBuscaGin=wrap.querySelector('#busca-gineco');
  if(inputBuscaGin){
    inputBuscaGin.oninput=e=>{
      state.buscaGineco=e.target.value;
      const q=e.target.value.toLowerCase().trim();
      wrap.querySelectorAll('tr[data-id]').forEach(r=>{
        const nome=(r.querySelector('strong')||{textContent:''}).textContent.toLowerCase();
        r.style.display=!q||nome.includes(q)?'':'none';
      });
    };
    inputBuscaGin.onclick=e=>e.stopPropagation();
  }
  wrap.querySelector('#btn-nova').onclick=()=>{state.modal={type:'novaPaciente'};state.novaPacienteTipo='ginecologica';state._lockPacienteTipo=true;render();};
  wrap.querySelector('#btn-fup-gineco').onclick=()=>{state.modal={type:'fupRetornoGineco'};render();};
  wrap.querySelectorAll('[data-mes-gin]').forEach(btn=>{
    btn.onclick=()=>{
      if(!state.ginecoMeses) state.ginecoMeses=new Set();
      if(state.ginecoMeses.has(btn.dataset.mesGin)) state.ginecoMeses.delete(btn.dataset.mesGin);
      else state.ginecoMeses.add(btn.dataset.mesGin);
      render();
    };
  });
  const diuPend=state.gyneco.map(migrateGin).filter(p=>{const s=statusDIU(p);return s&&s.level!=='ok';}).length;
  const diuBadge=wrap.querySelector('#fup-diu-badge');
  if(diuBadge&&diuPend>0){diuBadge.textContent=diuPend;diuBadge.style.cssText='display:inline-flex;align-items:center;justify-content:center;background:var(--warn);color:#fff;border-radius:50%;font-size:10px;font-weight:700;width:18px;height:18px;margin-left:6px;';}
  wrap.querySelector('#btn-fup-diu').onclick=()=>{state.modal={type:'fupDIU'};render();};
  const btnFiltroObst=wrap.querySelector('#btn-filtro-deobst');
  if(btnFiltroObst) btnFiltroObst.onclick=()=>{state.filtroDeObstetrica=!state.filtroDeObstetrica;render();};
  const btnClearGin=wrap.querySelector('#clear-filter-gin');
  if(btnClearGin) btnClearGin.onclick=()=>{state.ginecoMeses=new Set();render();};
  wrap.querySelectorAll('[data-ginid]').forEach(el=>el.onclick=()=>openGinecoModal(el.dataset.ginid));

  const tblWrap=wrap.querySelector('#tbl');
  if(lista.length===0){
    tblWrap.innerHTML=`<div class="empty"><h3>Nenhuma paciente ginecológica</h3></div>`;
  } else {
    const rows=lista.map(p=>{
      const alerts=alertasGineco(p);
      const alertTag=alerts.some(a=>a.level==='alert')?tag('atenção','alert'):(alerts.length?tag('lembrete','warn'):tag('em dia','ok'));
      const prox=proximoRetornoGineco(p);
      const papTag=p.papColetado?(p.papChecado?(p.papResultado==='alterado'?tag('alterado','alert'):(p.papResultado==='normal'?tag('normal ✓','ok'):tag('checado','ok'))):tag('aguardando','warn')):tag('não coletado','muted');
      const gmigTag=p.migradaDeObstetrica?`<span class="tag tag-muted" style="font-size:10px;">⟳ de obstetrícia</span>`:'';
      const diuStatus=statusDIU(p);
      const diuTag=diuStatus?(diuStatus.level==='ok'?tag('DIU ✓','ok'):tag('DIU','warn')):(p.diu&&p.diu.interesse?tag('DIU','muted'):tag('—','muted'));
      return `<tr data-id="${p.id}" style="cursor:pointer;">
        <td><strong>${p.nome}</strong> ${gmigTag}</td>
        <td>${papTag}</td>
        <td>${diuTag}</td>
        <td>${({'30dias':'30 dias','3meses':'3 meses','6meses':'6 meses','1ano':'1 ano'}[p.seguimento]||'1 ano')}</td>
        <td class="mono">${prox?fmtDate(prox):'—'}</td>
        <td>${alertTag}</td>
      </tr>`;
    }).join('');
    tblWrap.innerHTML=`<table><thead><tr><th>Nome</th><th>Papanicolau</th><th>DIU</th><th>Seguimento</th><th>Próximo retorno</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
    tblWrap.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openGinecoModal(r.dataset.id));
  }
  return wrap;
}


function viewConfig(){
  const wrap=el(`<div style="max-width:520px;"></div>`);
  wrap.innerHTML=`
    <div class="page-head"><div><h1>Configurações</h1></div></div>
    <h3 class="section-title" style="margin-top:0;">Integração Google Sheets</h3>
    <div class="card">
      <div class="banner banner-note" style="margin-bottom:14px;">
        Quando o Apps Script da planilha estiver configurado, cole a URL aqui. Todos os dados passarão a ser salvos diretamente no Google Sheets em tempo real.
      </div>
      <div class="field"><label>URL do Apps Script (Web App)</label><input type="url" id="cfg-script" placeholder="https://script.google.com/..." value="${state.settings.appsScriptUrl||''}"></div>
      <div style="display:flex;gap:8px;margin-top:0;">
        <button class="btn btn-primary" id="cfg-script-save">Salvar URL</button>
        <button class="btn btn-secondary" id="cfg-sync-all" ${!state.settings.appsScriptUrl?'disabled':''}>⬆ Sync inicial → Sheets</button>
      </div>
      <p class="muted-x" style="margin-top:10px;">Status atual: <strong>${state.syncStatus==='ok'?'🟢 Sync ativo':state.syncStatus==='err'?'🔴 Erro de conexão':state.syncStatus==='syncing'?'🔄 Sincronizando…':'⚪ Sem sync configurado'}</strong></p>
    </div>

    <div class="card">
      <div class="field"><label>PIN de acesso (deixe em branco para desativar)</label><input type="text" inputmode="numeric" id="cfg-pin" value="${state.settings.pin||''}"></div>
      <button class="btn btn-secondary" id="cfg-pin-save">Salvar PIN</button>
    </div>
  `;

  wrap.querySelector('#cfg-script-save').onclick=async()=>{
    state.settings.appsScriptUrl=wrap.querySelector('#cfg-script').value.trim();
    state.syncStatus=state.settings.appsScriptUrl?'ok':'off';
    await saveSet(); showToast(state.settings.appsScriptUrl?'URL salva. Sync ativo.':'URL removida.'); render();
  };
  const btnClear=wrap.querySelector('#cfg-clear-local');
  if(btnClear) btnClear.onclick=()=>{
    try{
      localStorage.removeItem(KEY_OBST);
      localStorage.removeItem(KEY_GIN);
      localStorage.removeItem(KEY_SET);
      showToast('Cache limpo. Recarregue a página para buscar dados do Sheets.');
    }catch(e){ showToast('Erro ao limpar cache.'); }
  };

  const btnNumerar=wrap.querySelector('#cfg-numerar-contratos');
  if(btnNumerar) btnNumerar.onclick=async()=>{
    // Assign sequential numbers to signed contracts that don't have one yet
    // Sort by data do parto (realized first) then by DPP
    const semNúmero=state.obstetric.filter(p=>p.contratoAssinado&&!p.numeroContrato)
      .sort((a,b)=>{
        const da=parseDate(a.parto.data)||calcDPP(a.dum,a.dppManual)||new Date(9999,0,1);
        const db=parseDate(b.parto.data)||calcDPP(b.dum,b.dppManual)||new Date(9999,0,1);
        return da-db;
      });
    if(!semNúmero.length){showToast('Todos os contratos assinados já têm número.');return;}
    // Find next available number
    const existing=state.obstetric.filter(p=>p.numeroContrato).map(p=>parseInt(p.numeroContrato.replace('AD-',''))||0);
    let next=(existing.length?Math.max(...existing):0)+1;
    for(const p of semNúmero){
      p.numeroContrato='AD-'+String(next).padStart(3,'0');
      next++;
      await commitObstEdit(p);
    }
    showToast(`${semNúmero.length} contratos numerados (AD-${String(next-semNúmero.length).padStart(3,'0')} a AD-${String(next-1).padStart(3,'0')}).`);
    render();
  };
  wrap.querySelector('#cfg-pin-save').onclick=async()=>{
    state.settings.pin=wrap.querySelector('#cfg-pin').value.trim();
    await saveSet(); showToast(state.settings.pin?'PIN salvo.':'PIN removido.');
  };
  const btnSyncAll=wrap.querySelector('#cfg-sync-all');
  if(btnSyncAll) btnSyncAll.onclick=async()=>{
    if(!state.settings.appsScriptUrl){showToast('Configure a URL primeiro.');return;}
    btnSyncAll.disabled=true; btnSyncAll.textContent='Enviando…';
    await syncToSheets('syncAll',{patients:state.obstetric});
    await syncToSheets('syncAllGin',{patients:state.gyneco});
    btnSyncAll.textContent='✓ Enviado!';
    showToast('Sync concluído: '+state.obstetric.length+' gestantes e '+state.gyneco.length+' ginecológicas.');
    setTimeout(()=>{btnSyncAll.disabled=false;btnSyncAll.textContent='⬆ Sync inicial → Sheets';},3000);
  };
  return wrap;
}


function renderModal(){
  const overlay=el(`<div class="overlay"></div>`);
  overlay.onclick=(e)=>{if(e.target===overlay){state.modal=null;render();}};
  const modal=el(`<div class="modal"></div>`);
  overlay.appendChild(modal);
  if(state.modal.type==='novaPaciente') modal.appendChild(modalNovaPaciente());
  else if(state.modal.type==='detalheObstetrica'){
    try{ modal.appendChild(modalDetalheObstetrica(state.modal.id)); }
    catch(e){ console.error('Modal error:',e); modal.innerHTML=`<div style="padding:20px;"><h3>Erro ao abrir ficha</h3><p style="color:var(--alert);">${e.message}</p><button class="btn btn-secondary" onclick="state.modal=null;render()">Fechar</button></div>`; }
  }
  else if(state.modal.type==='detalheGineco'){
    try{ modal.appendChild(modalDetalheGineco(state.modal.id)); }
    catch(e){ console.error('Gineco modal error:',e); modal.innerHTML=`<div style="padding:20px;"><h3>Erro</h3><p style="color:var(--alert);">${e.message}</p><pre style="font-size:11px;">${(e.stack||'').slice(0,300)}</pre><button class="btn btn-secondary" onclick="state.modal=null;render()">Fechar</button></div>`; }
  }
  else if(state.modal.type==='editarObst'){
    try{ modal.appendChild(modalEditarObst(state.modal.id)); }
    catch(e){ modal.innerHTML=`<div style="padding:20px;"><h3>Erro ao abrir edição</h3><p style="color:var(--alert);">${e.message}</p><button class="btn btn-secondary" onclick="state.modal=null;render()">Fechar</button></div>`; }
  }
  else if(state.modal.type==='editarGin') modal.appendChild(modalEditarGin(state.modal.id));
  else if(state.modal.type==='fupPosParto') modal.appendChild(modalFupPosParto());
  else if(state.modal.type==='alertaContratos') modal.appendChild(modalAlertaContratos());
  else if(state.modal.type==='alertaParceiro') modal.appendChild(modalAlertaParceiro());
  else if(state.modal.type==='fupRetornoGineco') modal.appendChild(modalFupRetornoGineco());
  else if(state.modal.type==='fupDIU') modal.appendChild(modalFupDIU());
  else if(state.modal.type==='assinarParceiro') modal.appendChild(modalAssinarParceiro(state.modal.patientId));
  else if(state.modal.type==='pdfParceiroFiltro'){
    try{ modal.appendChild(modalPdfParceiroFiltro(state.modal.allPartos||[],state.modal.allPapGineco||[])); }
    catch(e){ modal.innerHTML=`<div style="padding:20px;"><h3>Erro no PDF</h3><p style="color:var(--alert);">${e.message}</p><pre style="font-size:11px;">${(e.stack||'').slice(0,300)}</pre><button class="btn btn-secondary" onclick="state.modal=null;render()">Fechar</button></div>`; }
  }
  return overlay;
}


function modalNovaPaciente(){
  const wrap=el(`<div></div>`);
  const tipo=state.novaPacienteTipo;
  wrap.innerHTML=`
    <div class="modal-head"><h2>${state._lockPacienteTipo?'Nova paciente ginecológica':'Nova paciente'}</h2><button class="close-x">✕</button></div>
    ${!state._lockPacienteTipo?`<div class="type-switch">
      <button data-t="obstetrica" class="${tipo==='obstetrica'?'sel':''}">Obstétrica<small>gestante — pré-natal</small></button>
      <button data-t="ginecologica" class="${tipo==='ginecologica'?'sel':''}">Ginecológica<small>não gestante</small></button>
    </div>`:''}
    <div id="form-area"></div>
  `;
  wrap.querySelector('.close-x').onclick=()=>{state.modal=null;state._lockPacienteTipo=false;render();};
  wrap.querySelectorAll('.type-switch button').forEach(b=>b.onclick=()=>{state.novaPacienteTipo=b.dataset.t;render();});
  const fa=wrap.querySelector('#form-area');
  if(tipo==='obstetrica'){
    fa.innerHTML=`
      <div class="field-row">
        <div class="field"><label>Nome da paciente</label><input id="f-nome" placeholder="Nome completo"></div>
        <div class="field"><label>Telefone</label><input id="f-tel" placeholder="(99) 99999-9999" maxlength="15" oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').slice(0,15)"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Data da 1ª consulta</label><input type="date" id="f-cadastro" value="${isoDate(today())}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>DUM — Data da última menstruação</label><input type="date" id="f-dum"></div>
        <div class="field">
          <label>DPP <span id="dpp-hint" style="font-size:11px;color:var(--ink-muted);"></span></label>
          <input type="date" id="f-dpp">
        </div>
      </div>
      <button class="btn btn-primary" id="f-save">Cadastrar gestante</button>
    `;
    // Auto-calc DPP from DUM
    const dumInput=fa.querySelector('#f-dum');
    const dppInput=fa.querySelector('#f-dpp');
    const dppHint=fa.querySelector('#dpp-hint');
    if(dumInput&&dppInput){
      dumInput.oninput=()=>{
        if(dumInput.value){
          const dum=parseDate(dumInput.value);
          if(dum){
            const dpp=addDays(dum,280);
            dppInput.value=isoDate(dpp);
            dppInput.style.opacity='0.6';
            dppInput.readOnly=true;
            if(dppHint) dppHint.textContent='(calculada da DUM)';
          }
        } else {
          dppInput.value='';
          dppInput.style.opacity='1';
          dppInput.readOnly=false;
          if(dppHint) dppHint.textContent='(preencha a DUM ou insira manualmente)';
        }
      };
      dppInput.oninput=()=>{
        if(!dumInput.value&&dppInput.value){
          if(dppHint) dppHint.textContent='(DPP manual)';
        }
      };
    }

    fa.querySelector('#f-save').onclick=async()=>{
      const nome=fa.querySelector('#f-nome').value.trim();
      const dum=fa.querySelector('#f-dum').value;
      const cadastro=fa.querySelector('#f-cadastro').value||isoDate(today());
      const dppManualVal=(fa.querySelector('#f-dpp')||{}).value||'';
      if(!nome||(!dum&&!dppManualVal)){showToast('Informe nome e DUM ou DPP.');return;}
      const p=newObstPatient();
      p.nome=nome; p.telefone=fa.querySelector('#f-tel').value.trim();
      p.dum=dum; p.cadastradoEm=cadastro;
      // Save DPP manual if no DUM
      if(!dum){
        const dppVal=(fa.querySelector('#f-dpp')||{}).value||'';
        p.dppManual=dppVal;
      }
      const apres=calcDataApresParc(dum);
      p.dataApresParc=apres?isoDate(apres):'';
      state.obstetric=await addPatient(KEY_OBST,p);
      openObstetricModal(p.id);
    };
  } else if(tipo==='ginecologica'){
    fa.innerHTML=`
      <div class="field-row">
        <div class="field"><label>Nome da paciente</label><input id="f-nome" placeholder="Nome completo"></div>
        <div class="field"><label>Telefone</label><input id="f-tel"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Data da consulta</label><input type="date" id="f-data" value="${isoDate(today())}"></div>
        <div class="field"><label>Seguimento</label>
          <select id="f-seg">
            <option value="30dias">30 dias</option>
            <option value="3meses">3 meses</option>
            <option value="6meses">6 meses</option>
            <option value="1ano" selected>1 ano</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Papanicolau coletado?</label>
          <select id="f-pap"><option value="nao">Não</option><option value="sim">Sim</option></select>
        </div>
        <div class="field"><label>Interesse em DIU?</label>
          <select id="f-diu"><option value="nao">Não</option><option value="sim">Sim</option></select>
        </div>
      </div>
      <button class="btn btn-primary" id="f-save">Cadastrar paciente</button>
    `;
    fa.querySelector('#f-save').onclick=async()=>{
      const nome=fa.querySelector('#f-nome').value.trim();
      const data=fa.querySelector('#f-data').value;
      if(!nome||!data){showToast('Informe nome e data.');return;}
      const papSim=fa.querySelector('#f-pap').value==='sim';
      const diuSim=fa.querySelector('#f-diu').value==='sim';
      const p={id:crypto.randomUUID(),nome,telefone:fa.querySelector('#f-tel').value.trim(),
        cadastradoEm:data,ultimaConsulta:data,
        papColetado:papSim,dataColeta:papSim?data:null,
        papChecado:false,dataChecagem:null,retornoMarcado:false,dataRetorno:null,
        seguimento:fa.querySelector('#f-seg').value,observacoes:'',
        diu:{interesse:diuSim,disponivel:false,agendamento:false,insercao:false,pagamento:false,nf:false},
        consultas:[{id:crypto.randomUUID(),data,valor:state.settings.valorConsultaGineco||0,statusPagamento:'pendente'}]};
      state.gyneco=await addPatient(KEY_GIN,p);
      openGinecoModal(p.id);
    };
  } else {
    fa.innerHTML=`<p class="muted-x">Selecione o tipo de paciente acima.</p>`;
  }
  return wrap;
}


function modalEditarObst(id){
  const p=state.obstetric.find(x=>x.id===id);
  const t=today();
  const wrap=el(`<div></div>`);
  if(!p){wrap.innerHTML='<p>Não encontrado.</p>';return wrap;}
  wrap.innerHTML=`
    <div class="modal-head"><h2>Editar cadastro</h2><button class="close-x">✕</button></div>
    <div class="field-row">
      <div class="field"><label>Nome</label><input id="e-nome" value="${p.nome||''}"></div>
      <div class="field"><label>Telefone</label><input id="e-tel" value="${p.telefone||''}" maxlength="15" placeholder="(99) 99999-9999" oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').slice(0,15)"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Data da 1ª consulta</label><input type="date" id="e-cadastro" value="${p.cadastradoEm||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>DUM</label><input type="date" id="e-dum" value="${p.dum||''}"></div>
      <div class="field">
        <label>DPP <span id="e-dpp-hint" style="font-size:11px;color:var(--ink-muted);">${p.dum?'(calculada da DUM)':p.dppManual?'(manual)':'(preencha DUM ou insira manualmente)'}</span></label>
        <input type="date" id="e-dpp" value="${p.dum?isoDate(calcDPP(p.dum)):p.dppManual||''}" ${p.dum?'style="opacity:.6;" readonly':''}>
      </div>
    </div>
    ${p.parto.realizado?`
    <div class="field-row">
      <div class="field"><label>Data real do parto</label><input type="date" id="e-data-parto" value="${p.parto.data||''}" max="${isoDate(t)}"></div>
    </div>`:''}
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" id="e-save">Salvar alterações</button>
      <button class="btn btn-secondary" id="e-cancel">Cancelar</button>
    </div>
  `;
  wrap.querySelector('.close-x').onclick=wrap.querySelector('#e-cancel').onclick=()=>{state.modal={type:'detalheObstetrica',id};render();};

  // DUM → DPP auto-calc
  const eDum=wrap.querySelector('#e-dum');
  const eDpp=wrap.querySelector('#e-dpp');
  const eDppHint=wrap.querySelector('#e-dpp-hint');
  if(eDum&&eDpp){
    eDum.oninput=()=>{
      if(eDum.value){
        const d=parseDate(eDum.value);
        if(d){ eDpp.value=isoDate(addDays(d,280)); eDpp.readOnly=true; eDpp.style.opacity='.6'; if(eDppHint) eDppHint.textContent='(calculada da DUM)'; }
      } else {
        eDpp.value=''; eDpp.readOnly=false; eDpp.style.opacity='1'; if(eDppHint) eDppHint.textContent='(preencha DUM ou insira manualmente)';
      }
    };
    eDpp.oninput=()=>{ if(!eDum.value&&eDppHint) eDppHint.textContent='(manual)'; };
  }

  wrap.querySelector('#e-save').onclick=async()=>{
    p.nome=wrap.querySelector('#e-nome').value.trim();
    p.telefone=wrap.querySelector('#e-tel').value.trim();
    p.cadastradoEm=wrap.querySelector('#e-cadastro').value;
    const novaDum=wrap.querySelector('#e-dum').value;
    const novaDpp=(wrap.querySelector('#e-dpp')||{value:''}).value||'';
    if(novaDum!==p.dum){
      p.dum=novaDum;
      p.dppManual='';
      const apres=calcDataApresParc(novaDum);
      p.dataApresParc=apres?isoDate(apres):'';
    } else if(!novaDum&&novaDpp!==p.dppManual){
      p.dppManual=novaDpp;
    }
    if(p.parto.realizado){
      const novaDataParto=(wrap.querySelector('#e-data-parto')||{value:''}).value||'';
      if(novaDataParto) p.parto.data=novaDataParto;
    }
    await commitObstEdit(p);
    showToast('Cadastro atualizado.');
    state.modal={type:'detalheObstetrica',id};
    render();
  };
  return wrap;
}

        <div class="field"><label>Data real do parto</label><input type="date" id="pt-data" placeholder="dd/mm/aaaa" max="${isoDate(t)}"></div>
