<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Clínica AD · Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0; --surface:#FFFFFF; --border:#E3DED2; --ink:#26241F; --ink-muted:#79735F; --teal:#2F5D62; --teal-light:#E4EEED; --teal-dark:#1E3F43; --brick:#9C5233; --brick-light:#F3E6DC; --alert:#B23A32; --alert-light:#FBEAE8; --warn:#B8863B; --warn-light:#FBF1E1; --ok:#3F7A52; --ok-light:#E7F1E9; --radius:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0 0 4px 0;letter-spacing:-0.01em}
.mono{font-family:'IBM Plex Mono',monospace}
#app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--teal-dark);color:#EDEBE3;flex-shrink:0;padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:#fff;margin-bottom:2px}
.brand-sub{font-size:11.5px;color:#B9CFCE;margin-bottom:28px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#D9E6E5;cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:transparent;text-align:left;width:100%}
.nav-btn:hover{background:#28494D}
.nav-btn.active{background:var(--teal);color:#fff}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0}
.sidebar-foot{margin-top:auto;font-size:11px;color:#8FADAC;padding-top:16px}
main{flex:1;padding:28px 36px;max-width:1320px;overflow-y:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-head p{color:var(--ink-muted);margin:2px 0 0;font-size:13px}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn-secondary:hover{background:#F1EEE6}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-soft{background:none;border:1px solid #E3DED2;color:var(--ink-muted);font-family:inherit;font-weight:400;font-size:10.5px;padding:2px 9px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn-soft:hover{background:#F7F5EE;color:var(--ink)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-2,.grid-4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.stat-card{padding:13px 16px}
.stat-card .num{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--teal-dark);line-height:1}
.stat-card .label{font-size:11px;color:var(--ink-muted);margin-top:5px}
.stat-card .sub{font-size:10px;color:var(--ink-muted);margin-top:2px}
.section-title{font-size:15px;margin:28px 0 10px;color:var(--teal-dark)}
.section-title:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid #EEEAE0;vertical-align:middle}
tr:hover td{background:#FBFAF7}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;overflow-x:auto}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag-teal{background:var(--teal-light);color:var(--teal-dark)}
.tag-brick{background:var(--brick-light);color:var(--brick)}
.tag-alert{background:var(--alert-light);color:var(--alert)}
.tag-warn{background:var(--warn-light);color:var(--warn)}
.tag-muted{background:#EFEBE2;color:var(--ink-muted)}
.banner{padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.banner-note{background:var(--teal-light);color:var(--teal-dark)}
.banner-warn{background:var(--warn-light);color:var(--warn)}
.field{margin-bottom:0}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13.5px;background:#FBFAF7}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:0;background:#fff}
.month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.month-pill{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-muted)}
.month-pill.active{background:var(--teal);border-color:var(--teal);color:#fff}
.calc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.crosslink{display:flex;align-items:center;gap:8px;background:#28494D;border:none;color:#D9E6E5;font-size:12px;padding:9px 10px;border-radius:8px;cursor:pointer;width:100%;text-align:left;font-family:inherit;text-decoration:none}
.crosslink:hover{background:#345d61}
.cat-select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;background:#FBFAF7}
.modal-overlay{position:fixed;inset:0;background:rgba(38,36,31,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,0.25)}
.modal-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--ink);margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--ink-muted);margin-bottom:16px}
.modal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.modal-opt{text-align:left;border:1.5px solid var(--border);border-radius:9px;padding:11px 14px;background:#FBFAF7;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px}
.modal-opt:hover{border-color:var(--teal);background:var(--teal-light)}
.modal-opt strong{font-size:13px;color:var(--ink)}
.modal-opt span{font-size:11.5px;color:var(--ink-muted)}
.modal-cancel{width:100%;text-align:center;border:none;background:transparent;color:var(--ink-muted);font-family:inherit;font-size:12.5px;padding:8px;cursor:pointer}
.modal-cancel:hover{color:var(--ink)}
.login-wrap{flex:1;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login-brand{font-family:'Fraunces',serif;font-weight:700;font-size:24px;color:var(--teal-dark)}
.login-sub{font-size:12px;color:var(--ink-muted);margin-top:-8px;margin-bottom:6px}
.login-card input[type=password]{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#FBFAF7;width:100%}
.login-lembrar{font-size:12px;color:var(--ink-muted);display:flex;gap:6px;align-items:center;justify-content:center;cursor:pointer}
.login-msg{font-size:12.5px;color:var(--ink-muted);min-height:16px}
.up-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.up-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#A39E8E;font-weight:600}
.up-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1.5px dashed var(--border);border-radius:20px;background:#FBFAF7;font-size:12.5px;color:var(--ink);cursor:pointer}
.up-chip:hover{background:#F4F1E8}
.up-chip input{display:none}
.up-tag{font-size:11px;background:#E7EDE8;color:var(--teal-dark);padding:1px 7px;border-radius:5px}
.up-ate{color:var(--ink-muted);font-size:12px}
.up-badge{font-size:11px;background:var(--warn-light);color:var(--warn);padding:1px 8px;border-radius:10px;font-weight:600}
.upload-status{font-size:12.5px;color:var(--ink-muted)}
.upload-status.ok{color:var(--ok)}
.upload-status.err{color:var(--alert)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let DATA = null; // os dados chegam do servidor depois da senha; não ficam neste arquivo

// -------- Sincronização em nuvem (Google Sheets via Apps Script) --------
// Depois de publicar o Apps Script como Web App, cole aqui a URL que termina em /exec
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwK7flA_qPYh6gCAentPP52r2oV2GN-hjTjTfN_D35Qx0-i1diQ6uC-hetMDVmSyXAopw/exec';
const SENHA_KEY = 'clinicaad_fin_senha';
let senhaAtual = null; // senha digitada nesta sessão (nunca fica no código)
const CLOUD_AUTOR = 'Dra. Amanda Dantas';
let cloudStatus = { state:'idle', atualizado_em:null }; // idle | loading | synced | saving | error | offline
let cloudSaveTimer = null;

function cloudConfigured(){ return CLOUD_URL && CLOUD_URL.indexOf('COLE_AQUI') === -1; }

function setCloudStatus(s, extra){
  cloudStatus = Object.assign({state:s}, extra||{});
  const foot = document.getElementById('cloud-status');
  if(foot) foot.innerHTML = cloudStatusLabel();
}

function cloudStatusLabel(){
  if(!cloudConfigured()) return 'Dados salvos neste navegador';
  if(cloudStatus.state==='loading') return 'Carregando dados salvos…';
  if(cloudStatus.state==='saving') return 'Sincronizando…';
  if(cloudStatus.state==='synced') return 'Sincronizado' + (cloudStatus.atualizado_em ? ' às '+new Date(cloudStatus.atualizado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '');
  if(cloudStatus.state==='error') return 'Sem conexão — salvo só neste navegador' + (cloudStatus.motivo ? '<div style="font-size:10px;opacity:.85;margin-top:3px;word-break:break-word;">motivo: '+String(cloudStatus.motivo).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>' : '');
  return 'Dados salvos neste navegador';
}

function cloudSave(){
  if(!cloudConfigured() || !senhaAtual) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async ()=>{
    setCloudStatus('saving');
    const payload = JSON.stringify({premises:state.premises, overrides:state.overrides, learnedCategorias:state.learnedCategorias, extraLancs:state.extraLancs, extraAtendimentos:state.extraAtendimentos, janelasAtend:state.janelasAtend, faturamento:state.faturamento});
    try{
      const res = await fetch(CLOUD_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({acao:'salvar', colecao:'financeiro', id:'estado', json:payload, autor:CLOUD_AUTOR, senha:senhaAtual})
      });
      const txt = await res.text();
      let data;
      try{ data = JSON.parse(txt); }catch(e){ setCloudStatus('error', {motivo:'resposta inesperada do servidor: '+txt.slice(0,140).replace(/\s+/g,' ')}); return; }
      if(data.ok) setCloudStatus('synced', {atualizado_em: data.atualizado_em});
      else if(data.error==='senha incorreta'){ esquecerSenha(); senhaAtual = null; telaLogin('A senha foi alterada. Entre novamente.'); }
      else setCloudStatus('error', {motivo:String(data.error||'erro desconhecido')});
    }catch(e){
      setCloudStatus('error', {motivo:'não consegui falar com o servidor ('+(e&&e.message?e.message:e)+')'});
    }
  }, 1200);
}

const state = {
  view: 'objetivo',
  custosYear: null,  // "YYYY"; definido no primeiro render com o ano mais recente
  custosMonth: null, // "YYYY-MM"; definido no primeiro render com o mês mais recente
  custosCatFiltro: null, // categoria selecionada (clique no resumo, ou filtro manual)
  custosBusca: '',       // texto livre pra filtrar lançamentos
  recebYear: null,   // "YYYY"; definido no primeiro render com o ano mais recente
  recebMonth: 1,
  recebChartArea: 'Obstetrícia',
  recebChartMonth: 'all',
  overrides: {},        // { "lancIndex": novaCategoria }
  learnedCategorias: {}, // { "nome da contraparte": categoria } — aplicado a lançamentos futuros dessa contraparte
  extraLancs: [],        // lançamentos importados via upload de PDF, além dos originais embutidos
  faturamento: {}, // faturamento bruto por mês, lido do relatório da contabilidade: {"2026-9":{nB,vB,nA,vA}} = nº e soma das notas até R$ 800 (B) e acima (A)
  janelasAtend: [], // períodos [de,até] cobertos por relatórios iClinic importados: nesses períodos o relatório vale no lugar da base embutida
  extraAtendimentos: [], // atendimentos importados via upload do relatório iClinic (.xlsx), além dos originais embutidos
  uploadMsgReceb: null,
  uploadMsg: null,
  premises: {
    valorConsultaPorMes: {'2026-1':600,'2026-2':600,'2026-3':600,'2026-4':600,'2026-5':600,'2026-6':600,'2026-7':600,'2026-8':600,'2026-9':600,'2026-10':600,'2026-11':600,'2026-12':600},
    valorPartoPorMes: {'2026-1':16500,'2026-2':16500,'2026-3':16500,'2026-4':16500,'2026-5':16500,'2026-6':16500,'2026-7':16500,'2026-8':16500,'2026-9':16500,'2026-10':16500,'2026-11':16500,'2026-12':16500},
    partosPorMes: {'2026-1':6,'2026-2':6,'2026-3':10,'2026-4':11,'2026-5':10,'2026-6':6,'2026-7':11,'2026-8':11,'2026-9':8,'2026-10':8,'2026-11':8,'2026-12':8},
    medico: {
      solicitacoes:{qtd:30, limite:30, valorLote:25, valorExcedente:25},
      checagem:{qtd:30, limite:30, valorLote:25, valorExcedente:25},
      prenatal:{qtd:10, desconto:0, pct:70, valor:600},
      prenatalParceria:{qtd:10, desconto:0, pct:30, valor:600},
      inducoes:{qtd:1, valor:1000},
      conducao:{qtd:5, desconto:15, pct:25, valor:16500},
      auxiliar:{qtd:4, desconto:15, pct:15, valor:16500},
      visitas:{qtd:15, limite:15, valorLote:250, valorExcedente:162.5},
      cirurgiao:{qtd:0, desconto:15, pct:60, valor:16500}
    },
    medicoVersao: 3
  },
  sim: {
    calc: { qtdAtend:145, pctPagas:69, valAtend:600, qtdPartos:9, valParto:16500, retiradas:114292, medico:38396, outros:43816 }
  }
};

// Dados salvos antes do suporte a múltiplos anos guardavam essas premissas por
// número do mês (1–12), assumindo sempre 2026. Migra essas chaves antigas para
// o formato "ano-mês" (ex.: "2026-3"), preservando o que já foi editado.
function migrateLegacyMonthKeys(dict){
  const out = {};
  Object.keys(dict).forEach(k=>{
    if(/^\d+$/.test(k)) out['2026-'+k] = dict[k];
    else out[k] = dict[k];
  });
  return out;
}
function premGet(dict, year, m, def){
  const v = dict[year+'-'+m];
  return v===undefined ? def : v;
}
// cópia dos valores padrão do simulador médico (usada pelo botão "Voltar ao padrão" e para completar dados salvos)
const MEDICO_PADRAO = JSON.parse(JSON.stringify(state.premises.medico));

function premSet(dict, year, m, val){
  dict[year+'-'+m] = val;
}
function applyState(saved){
  if(!saved) { state.sim.calc.medico = Math.round(computeMedicoTotal()); return; }
  Object.assign(state.premises, saved.premises||{});
  if(saved.premises && saved.premises.medico){
    // completa cada linha com o padrão (linhas novas, como o pré-natal em parceria, entram sozinhas)
    const versaoSalva = saved.premises.medicoVersao || 0;
    const m = {};
    Object.keys(MEDICO_PADRAO).forEach(k=>{
      m[k] = Object.assign({}, MEDICO_PADRAO[k], saved.premises.medico[k] || {});
    });
    if(versaoSalva < 2) m.cirurgiao.pct = 60; // migração única: cirurgião principal passou de 40% para 60%
    if(versaoSalva < 3) m.inducoes = Object.assign({}, MEDICO_PADRAO.inducoes); // migração única: indução deixou de ser lote e passou a R$1.000 × quantidade
    else { delete m.inducoes.limite; delete m.inducoes.valorLote; delete m.inducoes.valorExcedente; }
    state.premises.medico = m;
  }
  state.premises.medicoVersao = 3;
  if(saved.premises && saved.premises.partosPorMes) Object.assign(state.premises.partosPorMes, migrateLegacyMonthKeys(saved.premises.partosPorMes));
  if(saved.premises && saved.premises.valorConsultaPorMes) Object.assign(state.premises.valorConsultaPorMes, migrateLegacyMonthKeys(saved.premises.valorConsultaPorMes));
  if(saved.premises && saved.premises.valorPartoPorMes) Object.assign(state.premises.valorPartoPorMes, migrateLegacyMonthKeys(saved.premises.valorPartoPorMes));
  // a calculadora não é gravada: sempre abre com as médias dos últimos 3 meses (edições valem só enquanto a página está aberta)
  state.overrides = saved.overrides || {};
  state.learnedCategorias = saved.learnedCategorias || {};
  state.extraLancs = saved.extraLancs || [];
  state.janelasAtend = Array.isArray(saved.janelasAtend) ? saved.janelasAtend : [];
  state.faturamento = (saved.faturamento && typeof saved.faturamento==='object') ? saved.faturamento : {};
  state.extraAtendimentos = (saved.extraAtendimentos || []).map(r=>r.slice(0,3)); // descarta nomes de pacientes de importações antigas
}
function loadState(){
  try{
    const raw = localStorage.getItem('clinicaad_fin_v6');
    applyState(raw ? JSON.parse(raw) : null);
  }catch(e){
    state.sim.calc.medico = Math.round(computeMedicoTotal());
  }
}
function saveState(){
  try{
    localStorage.setItem('clinicaad_fin_v6', JSON.stringify({premises:state.premises, overrides:state.overrides, learnedCategorias:state.learnedCategorias, extraLancs:state.extraLancs, extraAtendimentos:state.extraAtendimentos, janelasAtend:state.janelasAtend, faturamento:state.faturamento}));
  }catch(e){}
  cloudSave();
}
loadState();

// ---------------- Acesso com senha ----------------
// Ao abrir: pede a senha, o servidor confere e só então entrega os dados históricos e o estado salvo.
async function chamarServidor(corpo){
  const res = await fetch(CLOUD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(corpo)});
  return await res.json();
}
function senhaSalvaEmLocal(){ try{ return !!localStorage.getItem(SENHA_KEY); }catch(e){ return false; } }
function lerSenhaSalva(){ try{ return localStorage.getItem(SENHA_KEY) || sessionStorage.getItem(SENHA_KEY) || null; }catch(e){ return null; } }
function esquecerSenha(){ try{ localStorage.removeItem(SENHA_KEY); sessionStorage.removeItem(SENHA_KEY); }catch(e){} }
function guardarSenha(senha, lembrar){
  esquecerSenha();
  try{ (lembrar ? localStorage : sessionStorage).setItem(SENHA_KEY, senha); }catch(e){}
}

function telaMensagem(texto, comBotao){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const caixa = el('<div class="login-wrap"><div class="login-card"><div class="login-brand">Clínica AD</div><div class="login-sub">Financeiro</div><div class="login-msg" id="tela-msg"></div></div></div>');
  caixa.querySelector('#tela-msg').textContent = texto;
  if(comBotao){
    const b = el('<button class="btn btn-secondary" style="margin-top:12px;">Tentar de novo</button>');
    b.onclick = ()=>iniciar();
    caixa.querySelector('.login-card').appendChild(b);
  }
  app.appendChild(caixa);
}

function telaLogin(msg){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const caixa = el('<div class="login-wrap"><div class="login-card"><div class="login-brand">Clínica AD</div><div class="login-sub">Financeiro</div>'+
    '<input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">'+
    '<label class="login-lembrar"><input type="checkbox" id="login-lembrar" checked> Lembrar neste navegador</label>'+
    '<button class="btn btn-primary" id="login-entrar" style="width:100%;">Entrar</button>'+

async function entrar(senha, lembrar){
  telaMensagem('Abrindo…');
  let r;
  try{
    r = await chamarServidor({acao:'abrir', colecao:'financeiro', id:'estado', senha:senha});
  }catch(e){
    setCloudStatus('error');
    return telaMensagem('Não consegui conectar ao servidor. Confira a internet e tente de novo.', true);
  }
  if(!r || !r.ok){
    if(r && r.error==='senha incorreta'){ esquecerSenha(); return telaLogin('Senha incorreta.'); }
    return telaMensagem('O servidor não respondeu como esperado' + (r && r.error ? ' ('+r.error+')' : '') + '.', true);
  }
  senhaAtual = senha;
  guardarSenha(senha, lembrar);
  DATA = JSON.parse(r.base);
  if(!DATA.costCategories.includes('A classificar')) DATA.costCategories.push('A classificar');
  let cloudData = null;
  if(r.json){ try{ cloudData = JSON.parse(r.json); }catch(e){} }
  if(cloudData) applyState(cloudData);
  setCloudStatus('synced', {atualizado_em: r.atualizado_em || null});
  render();
  // dados na nuvem em formato antigo (sem a versão do simulador médico, com a calculadora gravada ou com nomes de pacientes
  // nos atendimentos): regrava já na versão atual, para o Sheets não guardar mais nada disso
  if(cloudData){
    const desatualizado = !(cloudData.premises && cloudData.premises.medicoVersao) || ('sim' in cloudData) || (cloudData.extraAtendimentos||[]).some(r=>r.length>3);
    if(desatualizado) cloudSave();
  }
}

// ---------------- Importação de extrato (PDF) ----------------
const COL_BOUNDS = {data:[0,80], lanc:[80,220], razao:[220,355], cnpj:[355,465], valor:[465,515], saldo:[515,100000]};
function colFor(x){
  for(const k in COL_BOUNDS){ const b=COL_BOUNDS[k]; if(x>=b[0] && x<b[1]) return k; }
  return 'other';
}
const DATE_RE = /^\d{2}\/\d{2}\/\d{4}$/;
function splitGlued(word){
  let m = word.match(/^(.+?)(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})$/);
  if(m) return [m[1], m[2]];
  m = word.match(/^(.+?)(\d{3}\.\d{3}\.\d{3}-\d{2})$/);
  if(m) return [m[1], m[2]];
  return [word, null];
}
function toFloatBR(s){
  if(!s || !s.trim()) return null;
  const clean = s.trim().replace(/\./g,'').replace(',', '.');
  const f = parseFloat(clean);
  return isNaN(f) ? null : f;
}

async function parsePdfToLancamentos(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const records = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale:1});
    const tc = await page.getTextContent();
    let words = [];
    tc.items.forEach(it=>{
      const str = it.str;
      if(!str || !str.trim()) return;
      const topY = Math.round((viewport.height - it.transform[5])*10)/10;
      const x0 = it.transform[4];
      const totalW = it.width || (str.length*5);
      const charW = totalW/Math.max(str.length,1);
      const tokens = str.split(/(\s+)/).filter(t=>t.length>0);
      let cursor = x0;
      tokens.forEach(tok=>{
        if(!tok.trim()){ cursor += tok.length*charW; return; }
        words.push({text:tok, x0:cursor, top:topY});
        cursor += tok.length*charW;
      });
    });
    if(words.length===0) continue;
    // group into lines
    const tops = [];
    const lineMap = {};
    words.forEach(w=>{
      let found=null;
      for(const t of tops){ if(Math.abs(t-w.top)<1.0){ found=t; break; } }
      if(found===null){ found=w.top; tops.push(found); lineMap[found]=[]; }
      lineMap[found].push(w);
    });
    tops.sort((a,b)=>a-b);
    // footer cutoff
    let footerTop = null;
    tops.forEach(t=>{
      lineMap[t].forEach(w=>{ if(w.text.toLowerCase()==='aviso:'){ footerTop = (footerTop===null)?t:Math.min(footerTop,t); } });
    });
    const usableTops = footerTop===null ? tops : tops.filter(t=>t<footerTop-0.5);
    if(usableTops.length===0) continue;
    // date-line tops
    const dateTops = usableTops.filter(t=> lineMap[t].some(w=> colFor(w.x0)==='data' && DATE_RE.test(w.text)) );
    if(dateTops.length===0) continue;
    function nearestDateTop(t){
      let best=dateTops[0], bd=Math.abs(dateTops[0]-t);
      dateTops.forEach(d=>{ const dist=Math.abs(d-t); if(dist<bd){ bd=dist; best=d; } });
      return best;
    }
    const recMap = {};
    usableTops.forEach(t=>{
      if(t < dateTops[0]-5) return;
      const rt = nearestDateTop(t);
      if(!recMap[rt]) recMap[rt]=[];
      recMap[rt].push(t);
    });
    Object.keys(recMap).map(Number).sort((a,b)=>a-b).forEach(rt=>{
      const lineTops = recMap[rt].sort((a,b)=>a-b);
      const cols = {data:[], lanc:[], razao:[], cnpj:[], valor:[], saldo:[]};
      lineTops.forEach(t=>{
        const ws = lineMap[t].slice().sort((a,b)=>a.x0-b.x0);
        ws.forEach(w=>{
          const c = colFor(w.x0);
          if(cols[c]) cols[c].push(w.text);
        });
      });
      if(cols.cnpj.length===0 && cols.razao.length>0){
        const last = cols.razao[cols.razao.length-1];
        const [namepart, idpart] = splitGlued(last);
        if(idpart){ cols.razao[cols.razao.length-1]=namepart; cols.cnpj=[idpart]; }
      }
      const dataTxt = cols.data.join(' ').trim();
      const m = dataTxt.match(/\d{2}\/\d{2}\/\d{4}/);
      if(!m) return;
      const [dd,mm,yyyy] = m[0].split('/');
      const isoDate = yyyy+'-'+mm+'-'+dd;
      const lancTxt = cols.lanc.join(' ').replace(/\s+/g,' ').trim();
      const razaoTxt = cols.razao.join(' ').replace(/\s+/g,' ').trim();
      const cnpjTxt = cols.cnpj.join(' ').replace(/\s+/g,' ').trim();
      const valorTxt = cols.valor.join(' ').replace(/\s+/g,' ').trim();
      if(lancTxt.toUpperCase().startsWith('SALDO')) return; // linha de saldo, não é transação
      const valor = toFloatBR(valorTxt);
      if(valor===null || valor>=0) return; // só saídas (valores negativos)
      records.push({d:isoDate, l:lancTxt, n:razaoTxt, cnpj:cnpjTxt, v:Math.abs(valor)});
    });
  }
  return records;
}

function categorizeNew(rec){
  if(rec.n && state.learnedCategorias[rec.n]) return state.learnedCategorias[rec.n];
  const key = rec.cnpj || rec.n;
  return DATA.costMapping[key] || 'A classificar';
}

async function handlePdfUpload(file){
  state.uploadMsg = {type:'info', text:'Lendo PDF…'};
  render();
  try{
    const parsed = await parsePdfToLancamentos(file);
    const existing = new Set();
    DATA.costLancamentos.forEach(l=> existing.add(lancFingerprint(l)) );
    state.extraLancs.forEach(l=> existing.add(lancFingerprint(l)) );
    let added = 0, skipped = 0;
    parsed.forEach(rec=>{
      const lanc = {d:rec.d, l:rec.l, n:rec.n, c:categorizeNew(rec), v:rec.v};
      const fp = lancFingerprint(lanc);
      if(existing.has(fp)){ skipped++; return; }
      existing.add(fp);
      state.extraLancs.push(lanc);
      added++;
    });
    saveState();
    state.uploadMsg = {type:'ok', text: added+' lançamento(s) novo(s) adicionado(s). '+skipped+' já existiam no histórico e foram ignorados.'};
  }catch(err){
    console.error(err);
    state.uploadMsg = {type:'err', text:'Não consegui ler esse PDF automaticamente (' + (err&&err.message?err.message:'erro desconhecido') + '). Pode me mandar o PDF direto no chat que eu processo por lá.'};
  }
  render();
}

// ---------------- Importação de relatório iClinic (XLSX) ----------------
function normalizeHeader(h){
  return String(h||'').trim().toLowerCase()
    .replace(/[áàâã]/g,'a').replace(/[éê]/g,'e').replace(/[íî]/g,'i')
    .replace(/[óôõ]/g,'o').replace(/[úû]/g,'u').replace(/ç/g,'c');
}
function excelDateToISO(val){
  if(val===null || val===undefined || val==='') return null;
  if(typeof val === 'number'){
    const epoch = Date.UTC(1899,11,30);
    const d = new Date(epoch + val*86400000);
    return d.toISOString().slice(0,10);
  }
  const s = String(val).trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return m[3]+'-'+m[2]+'-'+m[1];
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return s.slice(0,10);
  return null;
}
function emJanelaAtend(iso){ return state.janelasAtend.some(j=>iso>=j[0] && iso<=j[1]); }
function todosAtendimentos(){ return DATA.atendimentosRaw.filter(r=>!emJanelaAtend(r[0])).concat(state.extraAtendimentos); } // base embutida (fora dos períodos já importados) + importados

async function parseXlsxToAtendimentos(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const json = XLSX.utils.sheet_to_json(ws, {defval:''});
  const records = [];
  json.forEach(row=>{
    let dataVal=null, horaVal='', procVal='';
    Object.keys(row).forEach(k=>{
      const nk = normalizeHeader(k);
      if(nk==='data') dataVal = row[k];
      else if(nk==='horario') horaVal = row[k];
      else if(nk==='procedimento') procVal = row[k];
    });
    if(!dataVal || !procVal) return;
    const iso = excelDateToISO(dataVal);
    if(!iso) return;
    records.push([iso, String(horaVal||'').trim(), String(procVal).trim()]);
  });
  return records;
}

function anosComAtendimentos(somenteComDados){
  const all = todosAtendimentos();
  const anos = new Set(all.map(r=>r[0]&&r[0].slice(0,4)).filter(Boolean));
  if(!somenteComDados) anos.add(String(new Date().getFullYear()));
  return Array.from(anos).sort();
}
function computeRecebData(year, nClosed){
  const all = todosAtendimentos();
  const monthly = {};
  for(let m=1;m<=nClosed;m++) monthly[m] = {total:0, pagos:0, nao_pagos:0};
  const procTotals = {};
  all.forEach(rec=>{
    const iso = rec[0], proc = rec[2];
    if(!iso || iso.slice(0,4)!==String(year)) return;
    const month = parseInt(iso.slice(5,7),10);
    if(month<1 || month>nClosed) return;
    const meta = DATA.procCategoryMap[proc] || ['Outro','Consulta'];
    const tipo = meta[1];
    monthly[month].total++;
    const isPago = (tipo!=='Retorno' && tipo!=='Revisão');
    if(isPago) monthly[month].pagos++; else monthly[month].nao_pagos++;
    if(!procTotals[proc]) procTotals[proc] = {total:0, byMonth:{}, area:meta[0], tipo:meta[1]};
    procTotals[proc].total++;
    procTotals[proc].byMonth[month] = (procTotals[proc].byMonth[month]||0)+1;
  });
  return {monthly, procTotals};
}

// ---------------- RELATÓRIO DA CONTABILIDADE (faturamento bruto) ----------------
const FAT_CORTE_CONSULTA = 800; // notas até este valor = consultas (aproximação); acima = outros (partos, procedimentos…)
function brNum(str){ return parseFloat(str.replace(/\./g,'').replace(',','.')); }
async function parsePdfFaturamento(file){
  if(!window.pdfjsLib) throw new Error('leitor de PDF não carregou — confira a conexão e tente de novo');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const notas = [];        // {mk:'2026-9', v:valor bruto} de cada nota
  let totalRel = null;     // "Valor faturado" informado no resumo do relatório (para conferir a soma)
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const its = [];
    tc.items.forEach(it=>{ const t = it.str.trim(); if(t) its.push({x:it.transform[4], y:it.transform[5], t}); });
    const valores = its.filter(i=>/^R\$\s*-?[\d\.]+,\d{2}$/.test(i.t));
    const datas = its.filter(i=>/^\d{2}\/\d{2}\/\d{4}/.test(i.t));
    if(totalRel===null) its.filter(i=>/^Valor faturado$/i.test(i.t)).forEach(lab=>{
      if(totalRel!==null) return;
      let best = null;
      valores.forEach(v=>{ const dy = lab.y - v.y; if(dy>0 && dy<120 && Math.abs(v.x-lab.x)<60 && (!best || dy<best.dy)) best = {dy, v:v.t}; });
      if(best) totalRel = brNum(best.v.replace(/^R\$\s*/,''));
    });
    // cada nota tem um quadro "Valor bruto da cota": o valor é o R$ logo abaixo do rótulo e a data da nota é a data logo acima
    its.filter(i=>/^Valor bruto da cota$/i.test(i.t)).forEach(lab=>{
      let best = null, dt = null;
      valores.forEach(v=>{
        const dy = lab.y - v.y;
        if(dy>0 && dy<45 && Math.abs(v.x-lab.x)<90 && (!best || dy<best.dy)) best = {dy, v:v.t};
      });
      datas.forEach(d=>{
        const dy = d.y - lab.y;
        if(dy>0 && dy<150 && (!dt || dy<dt.dy)) dt = {dy, t:d.t};
      });
      if(best && dt){
        const m = dt.t.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
        notas.push({mk: m[3]+'-'+parseInt(m[2],10), v: brNum(best.v.replace(/^R\$\s*/,''))});
      }
    });
  }
  if(notas.length===0) throw new Error('não encontrei nenhuma nota — confira se é o "Relatório de Produção Médica"');
  const sm = a=>Math.round(a.reduce((x,y)=>x+y,0)*100)/100;
  const soma = sm(notas.map(n=>n.v));
  if(totalRel!==null && Math.abs(totalRel-soma)>0.01) throw new Error('a soma das notas (R$ '+fmtNum(soma)+') não bate com o "Valor faturado" do relatório (R$ '+fmtNum(totalRel)+')');
  const meses = {};
  notas.forEach(n=>{
    const g = meses[n.mk] || (meses[n.mk] = {b:[], a:[]});
    (n.v<=FAT_CORTE_CONSULTA ? g.b : g.a).push(n.v);
  });
  Object.keys(meses).forEach(k=>{ const g = meses[k]; meses[k] = {nB:g.b.length, vB:sm(g.b), nA:g.a.length, vA:sm(g.a)}; });
  return {meses, n:notas.length, total:soma, conferido:totalRel!==null};
}
function fmtNum(n){ return n.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
async function handleFatUpload(file){
  state.uploadMsgReceb = {type:'info', text:'Lendo relatório da contabilidade…'};
  render();
  try{
    const r = await parsePdfFaturamento(file);
    const ks = Object.keys(r.meses).sort((x,y)=>{ const A=x.split('-'), B=y.split('-'); return A[0]===B[0] ? A[1]-B[1] : A[0]-B[0]; });
    ks.forEach(k=>{ state.faturamento[k] = r.meses[k]; });
    const ult = ks[ks.length-1].split('-');
    state.recebYear = ult[0];
    saveState();
    const nome = k=>{ const q=k.split('-'); return DATA.monthNames[q[1]-1]+'/'+q[0].slice(2); };
    const quando = ks.length===1 ? nome(ks[0]) : nome(ks[0])+' a '+nome(ks[ks.length-1])+' ('+ks.length+' meses)';
    state.uploadMsgReceb = {type:'ok', text:'Relatório de '+quando+' importado: '+r.n+' notas, faturamento bruto R$ '+fmtNum(r.total)+'.'+(r.conferido?'':' Atenção: não consegui conferir com o total do relatório.')};
  }catch(err){
    console.error(err);
    state.uploadMsgReceb = {type:'err', text:'Não consegui ler esse relatório ('+(err&&err.message?err.message:'erro desconhecido')+').'};
  }
  render();
}

async function handleXlsxUpload(file){
  state.uploadMsgReceb = {type:'info', text:'Lendo planilha…'};
  render();
  try{
    const parsed = await parseXlsxToAtendimentos(file);
    if(parsed.length===0) throw new Error('nenhuma linha reconhecida — confira se o arquivo tem as colunas Data, Horário, Paciente e Procedimento');
    // o relatório vale para o período que ele cobre: apaga o que havia nesse período (base embutida e importações anteriores) e coloca o relatório no lugar
    const datas = parsed.map(r=>r[0]).sort();
    const de = datas[0], ate = datas[datas.length-1];
    const antes = todosAtendimentos().filter(r=>r[0]>=de && r[0]<=ate).length;
    state.extraAtendimentos = state.extraAtendimentos.filter(r=>!(r[0]>=de && r[0]<=ate));
    if(!state.janelasAtend.some(j=>j[0]===de && j[1]===ate)) state.janelasAtend.push([de, ate]);
    parsed.forEach(rec=>state.extraAtendimentos.push(rec));
    const added = parsed.length;
    saveState();
    state.uploadMsgReceb = {type:'ok', text: added+' atendimento(s) de '+de.split('-').reverse().join('/')+' a '+ate.split('-').reverse().join('/')+' importado(s), no lugar dos '+antes+' que havia(m) nesse período.'};
  }catch(err){
    console.error(err);
    state.uploadMsgReceb = {type:'err', text:'Não consegui ler essa planilha automaticamente (' + (err&&err.message?err.message:'erro desconhecido') + '). Confira se é o relatório "Pacientes por período" do iClinic, ou me manda o arquivo no chat que eu processo por lá.'};
  }
  render();
}

    (ultimoAt ? ' <span class="up-ate">até '+ultimoAt.slice(8,10)+'/'+ultimoAt.slice(5,7)+'/'+ultimoAt.slice(2,4)+'</span>' : '')+'</label>'+
    '<label class="up-chip"><input type="file" id="fat-upload" accept=".pdf">↥ <strong>Relatório da contabilidade</strong> <span class="up-tag">.pdf</span>'+
    (ultimoFat ? ' <span class="up-ate">até '+DATA.monthNames[ultimoFat[1]-1]+'/'+ultimoFat[0].slice(2)+'</span>' : '')+'</label>';

  upBox.querySelector('#fat-upload').onchange = (e)=>{ const f = e.target.files[0]; if(f) handleFatUpload(f); };
  const fileInputX = upBox.querySelector('#xlsx-upload');
  fileInputX.onchange = (e)=>{
    const f = e.target.files[0];

  if(state.uploadMsgReceb){

    wrap.appendChild(el('<div class="upload-status '+cls+'" style="margin:-8px 0 16px;">'+state.uploadMsgReceb.text+'</div>'));
  }

  wrap.appendChild(el('<div class="section-title" style="margin-top:0;font-size:17px;font-weight:700;">Atendimentos por categoria</div>'));
  const monthFilterRow = el('<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;"></div>');
  const yearSuffix = state.recebYear.slice(2);
  const monthOpts = ['<option value="all" '+(state.recebChartMonth==='all'?'selected':'')+'>Ano todo (jan–'+DATA.monthNames[nClosed-1].toLowerCase()+')</option>']
    .concat(DATA.monthNames.slice(0,nClosed).map((mn,i)=>'<option value="'+(i+1)+'" '+(state.recebChartMonth==(i+1)?'selected':'')+'>'+mn+'/'+yearSuffix+'</option>'));
  monthFilterRow.innerHTML = '<select id="year-filter-chart" style="font-family:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:#FBFAF7;">'+
    anos.map(y=>'<option value="'+y+'" '+(state.recebYear===y?'selected':'')+'>'+y+'</option>').join('')+'</select>'+
    '<select id="month-filter" style="font-family:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:#FBFAF7;">'+monthOpts.join('')+'</select>';
  wrap.appendChild(monthFilterRow);
  monthFilterRow.querySelector('#year-filter-chart').onchange = (e)=>{ state.recebYear = e.target.value; state.recebChartMonth = 'all'; render(); };
  monthFilterRow.querySelector('#month-filter').onchange = (e)=>{
    state.recebChartMonth = e.target.value==='all' ? 'all' : parseInt(e.target.value,10);
    render();
  };

  const chartsRow = el('<div class="grid grid-2" style="margin-bottom:12px;"></div>');

  // Donut 1: totais por área
  const donutCard1 = el('<div class="card"></div>');
  donutCard1.innerHTML = '<div style="font-size:12.5px;font-weight:700;margin-bottom:10px;">Totais por área</div>'+
    '<div style="display:flex;align-items:center;gap:16px;"><div style="width:150px;height:150px;flex-shrink:0;"><canvas id="donutArea"></canvas></div><div id="legendArea" style="flex:1;"></div></div>';
  chartsRow.appendChild(donutCard1);

  // Donut 2: por tipo dentro da área (com filtro)
  const donutCard2 = el('<div class="card"></div>');
  const areaOptions = AREA_ORDER.map(a=>'<option value="'+a+'" '+(a===state.recebChartArea?'selected':'')+'>'+a+'</option>').join('');
  donutCard2.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">'+
    '<strong style="font-size:12.5px;">Por tipo, dentro da área</strong>'+
    '<select id="area-filter" style="font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#FBFAF7;">'+areaOptions+'</select></div>'+
    '<div style="display:flex;align-items:center;gap:16px;"><div style="width:150px;height:150px;flex-shrink:0;"><canvas id="donutTipo"></canvas></div><div id="legendTipo" style="flex:1;"></div></div>';
  chartsRow.appendChild(donutCard2);

  wrap.appendChild(chartsRow);

  function legendHTML(items, month){
    const total = items.reduce((s,i)=>s+i.value,0) || 1;
    const showMedia = month==='all';
    let html = '<div>';
    html += '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--ink-muted);padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:5px;">'+
      '<span style="width:10px;flex-shrink:0;"></span>'+
      '<span style="flex:1;"></span>'+
      '<span style="width:32px;text-align:right;">Qtde</span>'+
      (showMedia?'<span style="width:52px;text-align:right;">Méd/mês</span>':'')+
      '<span style="width:34px;text-align:right;">%</span></div>';
    items.forEach(it=>{
      const pct = Math.round(it.value/total*100);
      const media = showMedia ? Math.round(it.value/nClosed) : null;
      html += '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 0;">'+
        '<span style="width:10px;height:10px;border-radius:3px;background:'+it.color+';flex-shrink:0;"></span>'+
        '<span style="flex:1;">'+it.label+'</span>'+
        '<span class="mono" style="width:32px;text-align:right;color:var(--ink-muted);">'+it.value+'</span>'+
        (showMedia?'<span class="mono" style="width:52px;text-align:right;color:var(--ink-muted);">'+media+'</span>':'')+
        '<span class="mono" style="width:34px;text-align:right;color:var(--ink-muted);">'+pct+'%</span></div>';
    });
    const totalMedia = showMedia ? Math.round(total/nClosed) : null;
    html += '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:6px 0 0;margin-top:4px;border-top:1px solid var(--border);">'+
      '<span style="width:10px;flex-shrink:0;"></span>'+
      '<span style="flex:1;">Total</span>'+
      '<span class="mono" style="width:32px;text-align:right;">'+total+'</span>'+
      (showMedia?'<span class="mono" style="width:52px;text-align:right;">'+totalMedia+'</span>':'')+
      '<span class="mono" style="width:34px;text-align:right;">100%</span></div>';
    html += '</div>';
    return html;
  }

  let chartArea=null, chartTipo=null;
  function drawDonut(canvasEl, legendEl, items, which){
    if(which==='area' && chartArea){ chartArea.destroy(); }
    if(which==='tipo' && chartTipo){ chartTipo.destroy(); }
    const c = new Chart(canvasEl, {
      type:'doughnut',
      data:{ labels: items.map(i=>i.label), datasets:[{ data: items.map(i=>i.value), backgroundColor: items.map(i=>i.color), borderWidth:2, borderColor:'#fff' }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => ' '+c.label+': '+c.raw } } } }
    });
    if(which==='area') chartArea=c; else chartTipo=c;
    legendEl.innerHTML = legendHTML(items, state.recebChartMonth);
  }

  function renderCharts(){
    const areaTotals = AREA_ORDER.map((a,i)=>({
      label:a,
      value: rowsByArea[a].reduce((s,r)=>s+countFor(r.nome, state.recebChartMonth),0),
      color: CHART_PALETTE[i%CHART_PALETTE.length]
    }));
    drawDonut(donutCard1.querySelector('#donutArea'), donutCard1.querySelector('#legendArea'), areaTotals, 'area');

    const tipoItems = (rowsByArea[state.recebChartArea]||[]).map((r,i)=>({
      label:r.nome, value: countFor(r.nome, state.recebChartMonth), color: CHART_PALETTE[i%CHART_PALETTE.length]
    }));
    drawDonut(donutCard2.querySelector('#donutTipo'), donutCard2.querySelector('#legendTipo'), tipoItems, 'tipo');
  }
  setTimeout(renderCharts, 0);
  donutCard2.querySelector('#area-filter').onchange = (e)=>{ state.recebChartArea = e.target.value; renderCharts(); };

  // -------- Gráfico de barras: faturamento bruto mensal (relatório da contabilidade) --------
  // colunas: meses fechados + qualquer mês que já tenha relatório enviado (mesmo que o mês ainda não esteja fechado)
  const nFat = Math.max.apply(null, [nClosed].concat(Object.keys(state.faturamento).filter(k=>k.split('-')[0]===String(yearNum)).map(k=>parseInt(k.split('-')[1],10))));
  wrap.appendChild(el('<div class="section-title" style="margin:14px 0 8px;font-size:17px;font-weight:700;">Receita mensal — faturamento bruto</div>'));
  const COR_ATEND = '#8FB4B6', COR_PARTO = '#D9AF8B';
  const barCard = el('<div class="card" style="margin-bottom:8px;"></div>');
  barCard.innerHTML = '<div style="display:flex;gap:14px;align-items:stretch;">'+
    '<div style="flex:1;height:210px;"><canvas id="barMensal"></canvas></div>'+
    '<div style="width:90px;height:210px;border-left:1px solid var(--border);padding-left:14px;flex-shrink:0;"><canvas id="barTotalAno"></canvas></div>'+
    '</div>'+
    '<div style="display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--ink-muted);padding-left:4px;">'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:'+COR_ATEND+';border-radius:2px;margin-right:5px;"></span>Consultas (notas até R$ 800)</span>'+
    '<span><span style="display:inline-block;width:9px;height:9px;background:'+COR_PARTO+';border-radius:2px;margin-right:5px;"></span>Outros (notas acima de R$ 800)</span></div>';
  wrap.appendChild(barCard);
  wrap.appendChild(el('<div class="banner banner-note" style="margin-bottom:10px;">📌 Valores do relatório de produção enviado pela contabilidade — faturamento bruto, sem descontos. “Consultas” é uma aproximação: soma das notas de até R$ 800,00 (o número entre parênteses é a quantidade de notas, não de consultas realizadas). “Outros” são as notas acima de R$ 800,00 (partos, procedimentos etc.). Meses sem relatório enviado ficam em branco.</div>'));

  const mesesLbl = [], consultaVals=[], outrosVals=[], consultaQty=[], outrosQty=[], notasTot=[];
  for(let m=1;m<=nFat;m++){
    const f = state.faturamento[yearNum+'-'+m];
    mesesLbl.push(DATA.monthNames[m-1]);
    consultaVals.push(f ? f.vB : 0);
    outrosVals.push(f ? f.vA : 0);
    consultaQty.push(f ? f.nB : 0);
    outrosQty.push(f ? f.nA : 0);
    notasTot.push(f ? f.nB+f.nA : null);
  }
  const CAT_PCT = 0.62, BAR_PCT = 0.92;
  const maxTotalMes = Math.max(...mesesLbl.map((_,i)=>consultaVals[i]+outrosVals[i]), 1);
  const yMaxMes = Math.ceil(maxTotalMes/25000)*25000 + 15000;

  const totalLabelPlugin = {
    id:'totalLabelPlugin',
    afterDatasetsDraw(chart){
      const {ctx, data, scales} = chart;
      const meta0 = chart.getDatasetMeta(0);
      ctx.save();
      ctx.fillStyle = '#1E3F43';
      ctx.font = '700 10px "IBM Plex Sans", sans-serif';
      ctx.textAlign = 'center';
      data.labels.forEach((label,i)=>{
        let total = 0;
        data.datasets.forEach(ds=> total += (ds.data[i]||0));
        if(!total || !meta0.data[i]) return;
        ctx.fillText(fmtK(total), meta0.data[i].x, scales.y.getPixelForValue(total) - 8);
      });
      ctx.restore();
    }
  };

  const segmentLabelPlugin = {
    id:'segmentLabelPlugin',
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      chart.data.datasets.forEach((ds, dsIndex)=>{
        const meta = chart.getDatasetMeta(dsIndex);
        meta.data.forEach((bar,i)=>{
          const val = ds.data[i];
          if(!val) return;
          const segH = Math.abs(bar.base - bar.y);
          if(segH < 9) return;
          const midY = (bar.base + bar.y)/2;
          const qty = ds.qty ? ds.qty[i] : null;
          const label = fmtK(val) + (qty!=null ? ' ('+qty+')' : '');
          const fontSize = segH < 18 ? 6.2 : (segH < 26 ? 7.2 : 8.2);
          ctx.fillStyle = '#fff';
          ctx.font = '600 '+fontSize+'px "IBM Plex Sans", sans-serif';
          ctx.fillText(label, bar.x, midY);
        });
      });
      ctx.restore();
    }
  };

  setTimeout(()=>{
  const chartMensal = new Chart(barCard.querySelector('#barMensal'), {
    type:'bar',
    data:{ labels: mesesLbl, datasets:[
      {label:'Consultas (notas até R$ 800)', data:consultaVals, backgroundColor:COR_ATEND, stack:'s', borderRadius:3, qty:consultaQty, categoryPercentage:CAT_PCT, barPercentage:BAR_PCT},
      {label:'Outros (notas acima de R$ 800)', data:outrosVals, backgroundColor:COR_PARTO, stack:'s', borderRadius:3, qty:outrosQty, categoryPercentage:CAT_PCT, barPercentage:BAR_PCT}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:22}},
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label: c => ' '+c.dataset.label+': '+fmt(c.raw)+' ('+c.dataset.qty[c.dataIndex]+' notas)' } } },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:10.5}} },
        y:{ suggestedMax:yMaxMes, grid:{display:false}, ticks:{font:{size:10}, callback:v=>fmtK(v)} }
      } },
    plugins:[totalLabelPlugin, segmentLabelPlugin]
  });

  // mede a espessura real da barra mensal renderizada, pra usar EXATAMENTE a mesma no gráfico Total
  const medidaBarra0 = chartMensal.getDatasetMeta(0).data[0];
  const medidaBarra = medidaBarra0 ? medidaBarra0.width : undefined;

  const totalQtyC = consultaQty.reduce((a,b)=>a+b,0), totalQtyO = outrosQty.reduce((a,b)=>a+b,0);
  const totalCVal = consultaVals.reduce((a,b)=>a+b,0), totalOVal = outrosVals.reduce((a,b)=>a+b,0);
  new Chart(barCard.querySelector('#barTotalAno'), {
    type:'bar',
    data:{ labels:['Total'], datasets:[
      {label:'Consultas (notas até R$ 800)', data:[totalCVal], backgroundColor:'#1E3F43', stack:'s', borderRadius:3, qty:[totalQtyC], barThickness:medidaBarra},
      {label:'Outros (notas acima de R$ 800)', data:[totalOVal], backgroundColor:'#9C5233', stack:'s', borderRadius:3, qty:[totalQtyO], barThickness:medidaBarra}
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:22}},
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label: c => ' '+c.dataset.label+': '+fmt(c.raw)+' ('+c.dataset.qty[c.dataIndex]+' notas)' } } },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:10.5, weight:'700'}} },
        y:{ display:false, grid:{display:false}, suggestedMax:(totalCVal+totalOVal)*1.08 }
      } },
    plugins:[totalLabelPlugin, segmentLabelPlugin]
  });
  }, 0);

  // -------- Tabelinha: notas emitidas (meses nas colunas, 3 linhas) --------
  const tw = el('<div class="table-wrap"></div>');
  const cel = (v, tag, extra) => '<'+tag+' style="text-align:right;padding:5px 8px;font-size:11px;white-space:nowrap;color:#9A9A92;'+(extra||'')+'">'+v+'</'+tag+'>';
  let sT=0, sB=0, sA=0;
  let hMes = cel('', 'th'), rT = cel('Notas emitidas','td','text-align:left;'), rB = cel('Até R$ 800','td','text-align:left;'), rA = cel('Acima de R$ 800','td','text-align:left;');
  for(let m=1;m<=nFat;m++){
    const f = state.faturamento[yearNum+'-'+m];
    hMes += cel(DATA.monthNames[m-1], 'th');
    rT += cel(f ? f.nB+f.nA : '—', 'td', '');
    rB += cel(f ? f.nB : '—', 'td');
    rA += cel(f ? f.nA : '—', 'td');
    if(f){ sT+=f.nB+f.nA; sB+=f.nB; sA+=f.nA; }
  }
  hMes += cel('Total', 'th', '');
  rT += cel(sT, 'td', 'background:#FBFAF7;');
  rB += cel(sB, 'td', 'background:#FBFAF7;');
  rA += cel(sA, 'td', 'background:#FBFAF7;');
  tw.innerHTML = '<table><thead><tr>'+hMes+'</tr></thead><tbody><tr>'+rT+'</tr><tr>'+rB+'</tr><tr>'+rA+'</tr></tbody></table>';
  wrap.appendChild(tw);

  // -------- Lucro estimado: faturamento (relatório da contabilidade) – despesas (extrato) --------
  wrap.appendChild(el('<div class="section-title" style="margin:18px 0 8px;font-size:17px;font-weight:700;">Lucro estimado <span style="font-weight:400;font-size:12px;color:var(--ink-muted);">(R$ mil)</span></div>'));
  const lancsLucro = getLancamentos();
  const despM = {}, retM = {};
  lancsLucro.forEach(l=>{
    const k = l.d.slice(0,7);
    if(l.c==='Retiradas') retM[k] = (retM[k]||0) + l.v; else despM[k] = (despM[k]||0) + l.v;
  });
  const cL = (v, tag, extra) => '<'+tag+' style="text-align:right;padding:5px 8px;font-size:11px;white-space:nowrap;'+(extra||'')+'">'+v+'</'+tag+'>';
  const corV = v => v<0 ? 'color:#B23A2E;' : '';
  const fmtMil = v => (v/1000).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:1});
  const linhas = [
    {nome:'Faturamento bruto', neg:false, st:''},
    {nome:'(–) Despesas, sem retiradas', neg:false, st:''},
    {nome:'= Resultado antes das retiradas', neg:false, st:'font-weight:700;'},
    {nome:'(–) Retiradas', neg:false, st:''},
    {nome:'= Resultado após retiradas', neg:false, st:'font-weight:700;'}
  ];
  const tot = [0,0,0,0,0];
  let hL = cL('', 'th'); const rowsL = linhas.map(l=>cL(l.nome,'td','text-align:left;'+l.st));
  for(let m=1;m<=nFat;m++){
    hL += cL(DATA.monthNames[m-1], 'th');
    const f = state.faturamento[yearNum+'-'+m];
    const k = yearNum+'-'+String(m).padStart(2,'0');
    if(!f){ rowsL.forEach((_,i)=>{ rowsL[i] += cL('—','td',linhas[i].st); }); continue; }
    const fat = f.vB + f.vA, desp = despM[k]||0, ret = retM[k]||0;
    const vals = [fat, desp, fat-desp, ret, fat-desp-ret];
    vals.forEach((v,i)=>{ tot[i]+=v; rowsL[i] += cL(fmtMil(v),'td', linhas[i].st + ((i===2||i===4)?corV(v):'')); });
  }
  hL += cL('Total','th','font-weight:700;');
  tot.forEach((v,i)=>{ rowsL[i] += cL(fmtMil(v),'td','font-weight:700;background:#FBFAF7;'+((i===2||i===4)?corV(v):'')); });
  const twL = el('<div class="table-wrap"></div>');
  twL.innerHTML = '<table><thead><tr>'+hL+'</tr></thead><tbody>'+rowsL.map(r=>'<tr>'+r+'</tr>').join('')+'</tbody></table>';
  wrap.appendChild(twL);
  wrap.appendChild(el('<div class="banner banner-note" style="margin:8px 0 10px;">📌 Estimativa: faturamento bruto do relatório da contabilidade (notas emitidas) menos as despesas do extrato (saídas pagas), e depois as retiradas. Só aparecem meses com relatório enviado; se o extrato do mês estiver incompleto, as despesas ficam subestimadas.</div>'));
  return wrap;
}

// ---------------- MÉDICO PARCEIRO ----------------
function viewMedico(){
  const wrap = el('<div style="font-size:12.5px;"></div>');
  wrap.appendChild(el('<div class="page-head" style="margin-bottom:14px;"><div><h1 style="font-size:19px;">Simulador Médico Parceiro</h1><p>Contrato RJapecanga</p></div></div>'));

  // -------- Bloco 1: referência do contrato (só pra lembrar de onde vêm os números) --------
  const refCard = el('<div class="card" style="display:inline-block;padding:12px 16px;margin-bottom:16px;font-size:10.5px;color:var(--ink-muted);line-height:1.6;"></div>');
  refCard.innerHTML = '<div style="font-size:11px;font-weight:700;color:var(--ink-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;">Regras do contrato (referência)</div>'+
    '<div style="margin-bottom:3px;"><strong>Lote/mês:</strong></div>'+
    '<div style="margin-bottom:3px;">Solicitações pós-consulta e Checagem de exames — até 30 a R$25 cada (lote R$750); excedente R$25.</div>'+
    '<div style="margin-bottom:8px;">Visitas pós-parto — até 15 a R$250 (lote R$3.750); excedente R$162,50 (65% do valor do lote).</div>'+
    '<div style="margin-bottom:8px;">Induções de parto — R$1.000,00 por indução realizada (sem lote).</div>'+
    '<div style="margin-bottom:3px;"><strong>Valor do parto ou da consulta conforme pagamento da paciente.</strong></div>'+
    '<div style="margin-bottom:3px;">Desconto de 15% sobre o valor do parto que é referente ao desconto de imposto pago.</div>'+
    '<div style="margin-bottom:3px;">% como Cirurgião principal 60%</div>'+
    '<div style="margin-bottom:3px;">% como Auxiliar 15%</div>'+
    '<div style="margin-bottom:3px;">% como Condução inicial 25%</div>'+
    '<div>% como Consulta de Pré-natal: 70% quando atendida individualmente pelo médico ou 30% quando atendida em parceria com a Dra. Amanda</div>';
  wrap.appendChild(refCard);

  // -------- Bloco 2: simulador do pagamento --------
  wrap.appendChild(el('<div class="section-title" style="margin-top:0;">Simulador do pagamento</div>'));

  const mp = state.premises.medico;
  function computeRow(key, type){
    const it = mp[key];
    if(type==='lote'){
      const loteTotal = it.limite*it.valorLote;
      const fora = Math.max(it.qtd-it.limite,0);
      return loteTotal + fora*it.valorExcedente;
    }
    if(key==='inducoes') return it.qtd*it.valor; // indução: valor fixo × quantidade (sem lote, sem desconto, sem %)
    const base = it.valor*(1-it.desconto/100);
    return it.qtd*base*(it.pct/100);
  }

  const dash = '<span class="mono" style="color:#C9C3B4;">—</span>';
  function inp(key, field, val){
    return '<input type="number" data-key="'+key+'" data-field="'+field+'" value="'+val+'" style="width:100%;box-sizing:border-box;padding:4px 5px;font-size:11.5px;border:1px solid var(--border);border-radius:5px;font-family:inherit;background:#FBFAF7;text-align:right;">';
  }

  // linhas do bloco esquerdo (lote): solicitações e checagem sem "Valor a mais" editável
  const loteRows = [

// ---------------- SIMULADOR ----------------
// padrões vivos da calculadora: médias dos 3 últimos meses fechados que têm dados (extrato e iClinic), sempre com os dados mais recentes
function mediasUlt3(){
  const now = new Date();
  const cur = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const ult3 = (chaves)=> Array.from(new Set(chaves)).filter(mk=>mk<cur).sort().slice(-3);
  // despesas (extrato)
  const lancs = getLancamentos();
  const mesesD = ult3(lancs.map(l=>l.d.slice(0,7)));
  const nD = mesesD.length || 1;
  const soma = (f)=> lancs.filter(l=>mesesD.includes(l.d.slice(0,7)) && f(l)).reduce((s,l)=>s+l.v,0);
  const retiradas = soma(l=>l.c==='Retiradas')/nD;
  const medico = soma(l=>l.c==='Médico Parceiro')/nD;
  const outros = (soma(()=>true) - soma(l=>l.c==='Retiradas') - soma(l=>l.c==='Médico Parceiro'))/nD;
  // atendimentos (iClinic)
  const ats = todosAtendimentos();
  const mesesA = ult3(ats.map(r=>r[0]&&r[0].slice(0,7)).filter(Boolean));
  const doPeriodo = ats.filter(r=>mesesA.includes(r[0].slice(0,7)));
  const pagos = doPeriodo.filter(r=>{ const tipo = (DATA.procCategoryMap[r[2]]||['Outro','Consulta'])[1]; return tipo!=='Retorno' && tipo!=='Revisão'; }).length;
  return {
    qtdAtend: mesesA.length ? doPeriodo.length/mesesA.length : 0,
    pctPagas: doPeriodo.length ? pagos/doPeriodo.length*100 : 0,
    retiradas, medico, outros
  };
}

function computeMedicoTotal(){
  const mp = state.premises.medico;
  let total = 0;
  ['solicitacoes','checagem','visitas'].forEach(key=>{
    const it = mp[key];
    const loteTotal = it.limite*it.valorLote;
    const fora = Math.max(it.qtd-it.limite,0);
    total += loteTotal + fora*it.valorExcedente;
  });
  total += mp.inducoes.qtd * mp.inducoes.valor;
  [['cirurgiao',true],['auxiliar',true],['conducao',true],['prenatal',false],['prenatalParceria',false]].forEach(([key,desc])=>{
    const it = mp[key];
    const base = it.valor*(1-it.desconto/100);
    total += it.qtd * base * (it.pct/100);
  });
  return total;
}

function viewSimulador(){
  const wrap = el('<div style="font-size:12.5px;"></div>');
  wrap.appendChild(el('<div class="page-head" style="margin-bottom:14px;"><div><h1 style="font-size:19px;">Simulador Financeiro</h1><p style="font-size:16px;">Calculadora</p></div></div>'));

  const s = state.sim.calc;
  // padrão: médias dos últimos 3 meses; o campo que você digita fica fixo, os demais seguem acompanhando
  if(!s.manuais) s.manuais = {};
  const medias = mediasUlt3();
  ['qtdAtend','pctPagas','retiradas','medico','outros'].forEach(k=>{ if(!s.manuais[k]) s[k] = Math.round(medias[k]); });

  const recAtend = s.qtdAtend * (s.pctPagas/100) * s.valAtend;
  const recPartos = s.qtdPartos * s.valParto;
  const recTotal = recAtend + recPartos;
  const custosTotal = s.retiradas + s.medico + s.outros;
  const resultado = recTotal - custosTotal;

  const card = el('<div class="card" style="max-width:560px;padding:18px 20px;"></div>');
  let html = '';

  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;font-family:\'Fraunces\',serif;font-weight:700;font-size:21px;color:'+(resultado>=0?'var(--teal-dark)':'var(--alert)')+';padding-bottom:12px;margin-bottom:14px;border-bottom:2px solid var(--border);"><span>Resultado do mês</span><span>'+fmt(resultado)+'</span></div>';

  html += '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--teal-light);border-radius:7px;padding:8px 12px;font-weight:700;font-size:15px;color:var(--teal-dark);margin:2px 0 8px;"><span>Faturamento Total</span><span class="mono">'+fmt(recTotal)+'</span></div>';
  html += '<div style="display:grid;grid-template-columns:1.3fr .55fr .55fr .75fr 1fr;gap:8px;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);font-weight:700;padding-bottom:3px;"><div>Item</div><div>Qtd</div><div>%</div><div>Valor</div><div style="text-align:right;">Subtotal</div></div>';
  html += simRow3('Consultas','qtdAtend','pctPagas','valAtend', s.qtdAtend, s.pctPagas, s.valAtend, recAtend, '% pagas — padrão: média últ. 3 meses');
  html += simRow2('Partos','qtdPartos','valParto', s.qtdPartos, s.valParto, recPartos);

  html += '<div style="height:16px;"></div>';

  html += '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--brick-light);border-radius:7px;padding:8px 12px;font-weight:700;font-size:15px;color:var(--brick);margin:2px 0 8px;"><span>Despesas Total</span><span class="mono">-'+fmt(custosTotal)+'</span></div>';
  html += simRow1('Retiradas','retiradas', s.retiradas, 'ref. média últ. 3 meses');
  html += simRow1('Médico Parceiro','medico', s.medico, 'padrão: média últ. 3 meses do extrato<div style="width:0;overflow:visible;margin-top:4px;"><button class="btn-soft" id="btn-import-medico">↻ importar do simulador ('+fmt(computeMedicoTotal())+')</button></div>');
  html += simRow1('Outras Despesas','outros', s.outros, 'média últ. 3 meses, exceto retiradas e médico parceiro');

  card.innerHTML = html;
  wrap.appendChild(card);

  card.querySelector('#btn-import-medico').onclick = ()=>{
    s.medico = Math.round(computeMedicoTotal());
    s.manuais.medico = true;
    saveState(); render();
  };

  card.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.onchange = (e)=>{
      s[e.target.dataset.field] = parseFloat(e.target.value)||0;
      if(['qtdAtend','pctPagas','retiradas','medico','outros'].includes(e.target.dataset.field)) s.manuais[e.target.dataset.field] = true;
      saveState(); render();
    };
  });

  return wrap;
}
